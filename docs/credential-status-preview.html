</style></head><body><header><h1>Credentials &amp; checks — clear status colours</h1><p>These are fictional examples rendered with the updated site component. Switch states to compare the summary and file labels. View document status jumps to the checklist; uploads and other account actions are disabled.</p><label>Example <select id="example"><option value="0">Verified</option><option value="1">Awaiting office review</option><option value="2">Missing files</option></select></label><label>Width <select id="width"><option value="wide">Full width</option><option value="phone">Phone width</option></select></label></header><p id="previewNotice" role="status"></p><main id="preview"></main><script>const pages=["\u003csection class=\"credentials-workspace\" aria-label=\"Credentials and checks\">\u003ch2>Credentials &amp; checks\u003c/h2>\u003cp>Add or replace your files here. The office records verification after reviewing them.\u003c/p>\n      \u003cdiv class=\"cred-overview is-verified\">\u003cdiv class=\"cred-overview-main\">\u003csvg class=\"cred-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m8 12 2.5 2.5L16 9\">\u003c/path>\u003c/svg>\u003cdiv>\u003cstrong>Essential documents verified\u003c/strong>\u003cp>All 7 essential requirements are verified. View the status and review dates below.\u003c/p>\u003c/div>\u003cbutton type=\"button\" data-cred-action=\"status\" aria-controls=\"credChecklist\">View document status\u003c/button>\u003c/div>\u003c/div>\n      \u003cdetails class=\"cred-explainer\">\u003csummary>How verification works\u003c/summary>\u003cp>The office reviews your evidence and records the result. \u003cb>Verified\u003c/b> means the check has been recorded. \u003cb>Awaiting office review\u003c/b> means the file has arrived and is waiting to be checked. \u003cb>Needs files\u003c/b> means a current file still needs to be added or replaced.\u003c/p>\u003cp>Use View document status to see each item, its review date and any reason for a requested replacement. Uploading a file does not verify it.\u003c/p>\u003c/details>\n      \n      \u003cdiv id=\"credNotice\" role=\"status\" aria-live=\"polite\">\u003c/div>\n      \u003csection class=\"cred-upload\" aria-labelledby=\"credUploadTitle\">\u003ch3 id=\"credUploadTitle\">Add a document\u003c/h3>\u003clabel for=\"credType\">Document type — full list\u003c/label>\u003cselect id=\"credType\">\u003coption value=\"\">Choose a document type…\u003c/option>\u003coptgroup label=\"Identity — 100 points of ID\">\u003coption value=\"passport-au\">Australian Passport — 70 points\u003c/option>\u003coption value=\"passport-foreign\">Foreign Passport — 70 points\u003c/option>\u003coption value=\"birth-cert\">Australian Birth Certificate — 70 points\u003c/option>\u003coption value=\"citizenship-cert\">Australian Citizenship Certificate — 70 points\u003c/option>\u003coption value=\"driver-licence\">Australian Driver Licence — 40 points\u003c/option>\u003coption value=\"proof-of-age\">Photo / Proof of Age Card — 40 points\u003c/option>\u003coption value=\"medicare\">Medicare Card — 25 points\u003c/option>\u003coption value=\"bank-card\">Bank or Credit Card — 25 points\u003c/option>\u003coption value=\"utility-bill\">Utility Bill / Rates Notice — 25 points\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Right to work in Australia\">\u003coption value=\"visa\">Visa Grant Notice / VEVO Check\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Checks &amp; clearances\">\u003coption value=\"ndis-screening\">NDIS Worker Screening Check\u003c/option>\u003coption value=\"wwcc\">Working with Children Check\u003c/option>\u003coption value=\"police-check\">National Police Check\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Training certificates\">\u003coption value=\"ndis-orientation\">NDIS Worker Orientation Module\u003c/option>\u003coption value=\"infection-control\">Infection Prevention &amp; Control Training\u003c/option>\u003coption value=\"first-aid\">First Aid (HLTAID011)\u003c/option>\u003coption value=\"cpr\">CPR (HLTAID009)\u003c/option>\u003coption value=\"medication-training\">Medication Administration Training\u003c/option>\u003coption value=\"manual-handling\">Manual Handling Training\u003c/option>\u003coption value=\"hi-competency\">High-intensity skills competency sign-off\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Qualifications &amp; resume\">\u003coption value=\"cert3-support\">Certificate III in Individual Support\u003c/option>\u003coption value=\"cert4-disability\">Certificate IV in Disability Support\u003c/option>\u003coption value=\"qualification\">Other Qualification / Certificate\u003c/option>\u003coption value=\"resume\">Resume / CV\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Anything else\">\u003coption value=\"other\">Other document\u003c/option>\u003c/optgroup>\u003c/select>\u003cdiv id=\"credFormArea\">\u003cp class=\"cred-hint\">Select the exact type first so your file is recorded in the right place.\u003c/p>\u003c/div>\u003c/section>\n      \u003ch3 id=\"credChecklistTitle\" tabindex=\"-1\">Essential documents\u003c/h3>\u003cdiv id=\"credChecklist\" class=\"cred-checklist\">\u003csection class=\"cred-item\" data-cred-requirement=\"identity\">\u003cdiv class=\"cred-item-head\">\u003ch4>100 points of identity\u003c/h4>\u003cspan class=\"cred-status is-verified\">\u003csvg class=\"cred-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m8 12 2.5 2.5L16 9\">\u003c/path>\u003c/svg>Verified\u003c/span>\u003cbutton type=\"button\" data-cred-action=\"add\" data-value=\"driver-licence\">Add another\u003c/button>\u003c/div>\u003cp class=\"cred-hint\">110 points uploaded. Include a primary document and at least 100 points in total. Each document type counts once.\u003c/p>\u003cdiv class=\"cred-id-group\">\u003cb>Australian Passport\u003c/b>\u003cdiv class=\"cred-file\">\u003cdiv class=\"cred-file-info\">\u003cb>passport-au-example.pdf\u003c/b>\u003cspan class=\"cred-status is-verified\">\u003csvg class=\"cred-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m8 12 2.5 2.5L16 9\">\u003c/path>\u003c/svg>Verified\u003c/span>\u003cspan class=\"cred-file-meta\">Verified 10 Sept 2026 · #1\u003c/span>\u003c/div>\u003cdiv class=\"cred-actions\">\u003ca href=\"/api/document-viewer?scope=worker&id=1\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"View passport-au-example.pdf (opens a new tab)\">View\u003c/a>\u003cbutton type=\"button\" data-cred-action=\"replace\" data-value=\"1\">Replace\u003c/button>\u003cbutton type=\"button\" data-cred-action=\"request-removal\" data-value=\"1\">Request removal\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"cred-id-group\">\u003cb>Australian Driver Licence\u003c/b>\u003cdiv class=\"cred-file\">\u003cdiv class=\"cred-file-info\">\u003cb>driver-licence-example.pdf\u003c/b>\u003cspan class=\"cred-status is-verified\">\u003csvg class=\"cred-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m8 12 2.5 2.5L16 9\">\u003c/path>\u003c/svg>Verified\u003c/span>\u003cspan class=\"cred-file-meta\">Verified 10 Sept 2026 · #2\u003c/span>\u003c/div>\u003cdiv class=\"cred-actions\">\u003ca href=\"/api/document-viewer?scope=worker&id=2\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"View driver-licence-example.pdf (opens a new tab)\">View\u003c/a>\u003cbutton type=\"button\" data-cred-action=\"replace\" data-value=\"2\">Replace\u003c/button>\u003cbutton type=\"button\" data-cred-action=\"request-removal\" data-value=\"2\">Request removal\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"cred-item\" data-cred-requirement=\"work-rights\">\u003cdiv class=\"cred-item-head\">\u003ch4>Right to work in Australia\u003c/h4>\u003cspan class=\"cred-status is-verified\">\u003csvg class=\"cred-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m8 12 2.5 2.5L16 9\">\u003c/path>\u003c/svg>Verified\u003c/span>\u003cbutton type=\"button\" data-cred-action=\"add\" data-value=\"visa\">Add another\u003c/button>\u003c/div>\u003cp class=\"cred-hint\">Australian passport, birth or citizenship evidence above can cover this too. Otherwise add your visa evidence.\u003c/p>\u003cp class=\"cred-coverage\">Covered by Australian Passport in your identity documents. \u003cbutton type=\"button\" data-cred-action=\"identity\" data-value=\"\">View supporting files\u003c/button>\u003c/p>\u003c/section>\u003csection class=\"cred-item\" data-cred-requirement=\"ndis-screening\">\u003cdiv class=\"cred-item-head\">\u003ch4>NDIS Worker Screening Check\u003c/h4>\u003cspan class=\"cred-status is-verified\">\u003csvg class=\"cred-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m8 12 2.5 2.5L16 9\">\u003c/path>\u003c/svg>Verified\u003c/span>\u003cbutton type=\"button\" data-cred-action=\"add\" data-value=\"ndis-screening\">Add another\u003c/button>\u003c/div>\u003cp class=\"cred-hint\">Required before your profile can go live — apply through your state screening unit.\u003c/p>\u003cdiv class=\"cred-file\">\u003cdiv class=\"cred-file-info\">\u003cb>ndis-screening-example.pdf\u003c/b>\u003cspan class=\"cred-status is-verified\">\u003csvg class=\"cred-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m8 12 2.5 2.5L16 9\">\u003c/path>\u003c/svg>Verified\u003c/span>\u003cspan class=\"cred-file-meta\">Verified 10 Sept 2026 · #3\u003c/span>\u003c/div>\u003cdiv class=\"cred-actions\">\u003ca href=\"/api/document-viewer?scope=worker&id=3\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"View ndis-screening-example.pdf (opens a new tab)\">View\u003c/a>\u003cbutton type=\"button\" data-cred-action=\"replace\" data-value=\"3\">Replace\u003c/button>\u003cbutton type=\"button\" data-cred-action=\"request-removal\" data-value=\"3\">Request removal\u003c/button>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"cred-item\" data-cred-requirement=\"ndis-orientation\">\u003cdiv class=\"cred-item-head\">\u003ch4>NDIS Worker Orientation Module\u003c/h4>\u003cspan class=\"cred-status is-verified\">\u003csvg class=\"cred-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m8 12 2.5 2.5L16 9\">\u003c/path>\u003c/svg>Verified\u003c/span>\u003cbutton type=\"button\" data-cred-action=\"add\" data-value=\"ndis-orientation\">Add another\u003c/button>\u003c/div>\u003cp class=\"cred-hint\">The free 90-minute Commission module &quot;Quality, Safety and You&quot;.\u003c/p>\u003cdiv class=\"cred-file\">\u003c  \u003cb>Awaiting office review\u003c/b> means the file has arrived and is waiting to be checked. \u003cb>Needs files\u003c/b> means a current file still needs to be added or replaced.\u003c/p>\u003cp>Use View document status to see each item, its review date and any reason for a requested replacement. Uploading a file does not verify it.\u003c/p>\u003c/details>\n      \n      \u003cdiv id=\"credNotice\" role=\"status\" aria-live=\"polite\">\u003c/div>\n      \u003csection class=\"cred-upload\" aria-labelledby=\"credUploadTitle\">\u003ch3 id=\"credUploadTitle\">Add a document\u003c/h3>\u003clabel for=\"credType\">Document type — full list\u003c/label>\u003cselect id=\"credType\">\u003coption value=\"\">Choose a document type…\u003c/option>\u003coptgroup label=\"Identity — 100 points of ID\">\u003coption value=\"passport-au\">Australian Passport — 70 points\u003c/option>\u003coption value=\"passport-foreign\">Foreign Passport — 70 points\u003c/option>\u003coption value=\"birth-cert\">Australian Birth Certificate — 70 points\u003c/option>\u003coption value=\"citizenship-cert\">Australian Citizenship Certificate — 70 points\u003c/option>\u003coption value=\"driver-licence\">Australian Driver Licence — 40 points\u003c/option>\u003coption value=\"proof-of-age\">Photo / Proof of Age Card — 40 points\u003c/option>\u003coption value=\"medicare\">Medicare Card — 25 points\u003c/option>\u003coption value=\"bank-card\">Bank or Credit Card — 25 points\u003c/option>\u003coption value=\"utility-bill\">Utility Bill / Rates Notice — 25 points\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Right to work in Australia\">\u003coption value=\"visa\">Visa Grant Notice / VEVO Check\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Checks &amp; clearances\">\u003coption value=\"ndis-screening\">NDIS Worker Screening Check\u003c/option>\u003coption value=\"wwcc\">Working with Children Check\u003c/option>\u003coption value=\"police-check\">National Police Check\u003c/option>\u003c/opt
