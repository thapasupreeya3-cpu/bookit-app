.verify-app{--vf-ink:#20304c;--vf-muted:#617087;--vf-line:#dbe2eb;--vf-navy:#203566;--vf-warm:#f7f4ef;color:var(--vf-ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.55;padding-top:18px}.verify-app *{box-sizing:border-box}.verify-app [hidden]{display:none!important}.verify-app h1,.verify-app h2,.verify-app h3,.verify-app h4,.verify-app p{margin:0}.verify-app h1{font-family:Sora,Inter,sans-serif;font-size:32px;letter-spacing:-1px;line-height:1.25}.verify-app h2{font-size:21px;line-height:1.3;letter-spacing:-.4px}.verify-app h3{font-size:16px;line-height:1.4}.verify-app a{color:var(--vf-navy);text-decoration:none}.verify-app a:hover{text-decoration:underline}.verify-app :is(a,button,input,textarea,select):focus-visible{outline:3px solid #b57417;outline-offset:3px}.verify-app button,.verify-app input,.verify-app select,.verify-app textarea{font:inherit}.verify-app button{cursor:pointer}.verify-app button:disabled{cursor:wait;opacity:.55}.vf-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.vf-topnav{display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--vf-line);padding:0 0 15px;font-size:14px}.vf-topnav a{padding:7px 0;color:var(--vf-muted)}.vf-topnav a[aria-current]{color:var(--vf-navy);font-weight:700}.vf-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:31px 0 25px}.vf-heading>div>p:last-child{margin-top:9px;color:var(--vf-muted);font-size:15px}.vf-eyebrow{font-size:11px;font-weight:750;letter-spacing:1.4px;color:var(--vf-muted);margin-bottom:9px!important}.vf-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 14px;border:1px solid transparent;border-radius:8px;font-size:13px!important;font-weight:650;line-height:1.4;text-decoration:none!important;white-space:normal;background:#edf1f6;color:var(--vf-ink)}.vf-button.vf-primary{background:var(--vf-navy);color:white;border-color:var(--vf-navy)}.vf-button.vf-primary:hover{background:#14264f}.vf-button.vf-outline{background:#fff;border-color:#cbd5e2}.vf-button.vf-quiet{background:#edf1f6}.vf-button:hover{filter:brightness(.97)}
.vf-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px;margin-bottom:24px}.vf-stat{background:#fff;border:1px solid var(--vf-line);border-radius:12px;padding:17px 20px;display:grid;grid-template-columns:1fr auto;gap:8px;box-shadow:0 2px 3px #20356603;text-decoration:none!important}.vf-stat>span{font-size:13px;font-weight:650}.vf-stat b{font-size:30px;font-weight:650;line-height:1;grid-row:1/3;grid-column:2;align-self:center;font-variant-numeric:tabular-nums}.vf-stat small{font-size:12px;color:var(--vf-muted)}.vf-stat.is-selected{border-color:var(--vf-navy);box-shadow:0 0 0 1px var(--vf-navy)}.vf-stat:hover{background:#fafbfd}

ilter by review status"></div><div class="vf-workspace"><section class="vf-queue" aria-label="People to review"><div id="vfQueue">${blank('Loading the queue','Getting the latest review status…')}</div></section><section id="vfDetail" class="vf-detail" aria-label="Selected person’s review">${blank('Choose a person to review','Their checklist, evidence and review actions will appear here.')}</section></div><p class="vf-footer-note">Statuses reflect the existing eligibility rules. Every recorded decision is attributed to the reviewer.</p><label class="vf-examples"><input id="vfExamples" type="checkbox" ${params().get('examples')==='1'?'checked':''}> Show example accounts</label></div>`;}
  async function render(wrap=$('adminContent')){

  function screening(){const d=current,s=d.screening||{},r=d.platform.registers||[];return card('Worker screening database',`<p class="vf-notice">A certificate and a live register check are separate evidence. Record what the database actually says.</p>${d.platform.blocks?.length?`<details><summary>Current eligibility findings (${d.platform.blocks.length})</summary><ul>${d.platform.blocks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}${form('screening',`<div class="vf-two-fields">${select('outcome','Worker status',[['','Select the recorded status'],['clearance','Clearance'],['pending','Application pending'],['exclusion','Exclusion'],['interim-bar','Interim bar'],['suspended','Suspended'],['expired','Expired']],s.screening_outcome)}${select('eligible','Eligible to work',[['','Select the recorded result'],['yes','Yes'],['no','No']],s.screening_eligible)}${field('expiry','Clearance expiry',s.screening_expiry,'date')}${field('check_number','Clearance / reference number',s.screening_ref,'text','maxlength="40"')}</div><label class="vf-confirm"><input type="checkbox" name="linked" ${s.nwsd_linked_at?'checked':''}><span>I confirmed this worker is linked to our organisation in the database.</span></label>${textarea('note','Register check evidence','','required minlength="10" maxlength="300"')}${confirm('I checked the database and these fields match the result.')}`,'Record screening check')}`)+card('Banning register checks',`<p>Record each register independently. A result is never preselected as clear.</p>${form('banning',r.map(x=>select(({ndis:'result',aged:'aged_result',acqsc:'acqsc_result'})[x.key]||x.key,x.label||x.short||x.key,[['','Choose the result'],['clear','No banning order found'],['banned','Banning order found'],['unchecked','Not checked']]) + `<p class="vf-help">Last recorded: ${esc(x.result||'unchecked')}${x.checked_at?' · '+date(x.checked_at):''}</p>`).join('')+textarea('note','Sources and evidence checked','','required minlength="10" maxlength="400"   function plan(){const d=current,p=d.plan;return !p?blank('No confirmed support plan yet','The participant or an authorised helper must confirm the plan before the office reviews it.'):planChangesPanel()+card('Support plan · version '+p.version,`<div class="vf-preview-head"><span>Confirmed ${date(p.confirmed_at)}</span><a href="${p.url}" target="_blank" rel="noopener">Open full plan ↗</a></div><iframe class="vf-plan-frame" src="${p.url}" title="${esc(d.name)} — current support plan version ${p.version}" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe>${p.reviewed_at?`<p class="vf-recorded">Reviewed by ${esc(p.reviewed_by)} · ${date(p.reviewed_at)}</p>`:''}${d.plan_review?form('review-plan',`<p>Recording this review applies to this confirmed version. The server checks the version again when you save.</p>${confirm('I read this support plan version and completed the office review.')}`,'Record plan review'):badge('Current version reviewed','ready')}`);}

  function history(){const d=current;return card('Review activity',d.history.length?`<ol class="vf-timeline">${d.history.map(x=>`<li><span class="vf-timeline-dot"></span><div><strong>${esc(x.action)}</strong><p>${esc(x.subject)}</p><small>${esc(x.actor_name)} · ${date(x.created_at)}</small></div></li>`).join('')}</ol>`:blank('No workspace decisions recorded yet','New review actions appear here with the reviewer and date. Earlier document evidence remains on each document.'))+card('Existing evidence on this file',d.documents.filter(x=>x.verified_at||x.review_note).map(x=>`<div class="vf-check-row"><div><strong>${esc(x.type_label)}</strong><p>${esc(x.verify_note||x.review_note)}</p><small>${esc(x.verified_by||'Correction requested')}${x.verified_at?' · '+date(x.verified_at):''}</small></div></div>`).join('')||'<p>No earlier document reviews are recorded.</p>');}

  function clearConfirmations(){for(const [key,value] of drafts)if(key.startsWith(`${account}:${current?.id}:`)&&'confirm'in value)value.confirm=false;}
  function followupHistory(){const rows=current.automation?.followups||[];return rows.length?card('Combined requests',rows.map(f=>`<div class="vf-followup"><strong>${f.status==='active'?'Following up':f.status==='completed'?'Requested items received':f.status==='needs-office'?'Office follow-up needed':'Follow-ups stopped'}</strong><p>${f.remaining.length} selected items still outstanding · ${f.reminders_sent} of ${f.max_reminders} reminders queued</p>${['active','needs-office'].includes(f.status)?`<p class="vf-help">Reminders wait for the previous message to be sent and respect routine email preferences.${f.due_date?' Requested by '+date(f.due_date)+'.':''}</p>${form('stop-followups',confirm('Stop further automatic messages for this checklist.'),'Stop follow-ups',`data-followup="${f.id}"`)}`:''}</div>`).join('')):'';}
  function combinedRequest(){const d=current,items=d.automation?.candidates||[],active=d.automation?.followups?.some(f=>f.status==='active');return card('One checklist, fewer follow-ups',`<p>Select the items the person needs to complete. Office checks are excluded. Each reminder is rebuilt from the items still outstanding.</p>${active?'<p class="vf-notice">A combined request is already running. Stop it before approving a replacement.</p>':items.length?form('request-checklist',`<div class="vf-request-items">${items.map(x=>`<label class="vf-confirm"><input type="checkbox" name="item:${esc(x.key)}" checked><span>${esc(x.label)}</span></label>`).join('')}</div>${textarea('note','Initial message','Please complete the selected items in your account. Contact the office if you need help.','required minlength="10" maxlength="1000"')}${field('due_date','Requested by (optional)','','date')}<div class="vf-two-fields">${select('interval_days','Time between follow-ups',[[3,'3 days'],[7,'7 days'],[14,'14 days']],3)}${select('max_reminders','Automatic follow-ups',[[0,'None — send the initial request only'],[1,'Up to 1 reminder'],[2,'Up to 2 reminders'],[3,'Up to 3 reminders']],2)}</div><p class="vf-help">Follow-ups start after the requested date, if set. They stop when these items are complete. An unanswered checklist returns to the office after the selected limit.</p>${confirm('I reviewed these items and approve the initial message and selected automatic follow-ups.')}`,'Approve checklist and follow-ups'):'<p class="vf-complete">There are no outstanding person-owned items to request.</p>'}`)+followupHistory();}
  function suggestionPanel(doc){if(current.role!=='worker'||doc.verified_at)return '';const a=current.assistance,s=a?.suggestions?.find(x=>x.doc_id===doc.id);if(!s)return `<p class="vf-help">${a?.enabled?'Document reading is available in the worker’s upload workflow. Their consented suggestions will appear here.':'Automatic document reading is not configured. You can continue reviewing the original evidence.'}</p>`;
    return card('Suggested document details',`<p>From the worker’s consented document-reading request. Compare each field with the original above. Saving details does not verify the document.</p><p class="vf-help">Provider confidence estimate: ${Math.round(s.confidence*100)}% · Suggested issuer: ${esc(s.issuer||'Not identified')}</p><details><summary>Text used for the suggestion</summary><p class="vf-source-text">${esc(s.source_text||'No source text supplied')}</p></details>${form('review-suggestions',`<div class="vf-two-fields">${field('expiry_date','Expiry date',s.expiry_date,'date')}${field('check_number','Certificate or check number',s.check_number,'text','maxlength="100"')}</div>${select('decision','Use these suggestions',[['modified','Save the fields after checking or editing'],['rejected','Discard these suggestions']])}${confirm('I compared these fields with the original evidence and reviewed the selected outcome.')}`,'Save reviewed details',`data-document="${doc.id}" data-suggestion="${s.id}"`)}`);}
  const displayValue=v=>v===''||v==null?'Not recorded':Array.isArray(v)?v.join(', '):typeof v==='object'?JSON.stringify(v):String(v);
  function planChangesPanel(){const d=current.plan_changes;if(!d)return '';return card('Changes since office review',!d.baseline?'<p>No earlier reviewed version is available for comparison. Read the complete current plan.</p>':`<p>Compared with version ${esc(d.version)}, reviewed ${date(d.reviewed_at)} (${esc(d.baseline)}).</p>${d.changes.length?`<div class="vf-plan-changes">${d.changes.map(x=>`<article><h4>${esc(x.label)}</h4><div class="vf-two-fields"><div><small>Previously reviewed</small><p>${esc(displayValue(x.before))}</p></div><div><small>Current plan</small><p>${esc(displayValue(x.after))}</p></div></div></article>`).join('')}</div>`:'<p>No changes to the compared plan answers.</p>'}<p class="vf-help">This comparison supports your review. Read the complete current plan before confirming it.</p>`);}
  function guideNext(){if(!current)return;const d=current,doc=d.documents.find(x=>!x.verified_at&&!x.accepted_at&&x.has_file&&!['rejected','superseded'].includes(x.review));let check='';

    paintDetail();const target=check?$('vfDetail')?.querySelector?.(`[data-check="${check}"]`):$('vfDetail')?.querySelector?.('.vf-form');target?.scrollIntoView?.({block:'nearest',behavior:'smooth'});target?.querySelector?.('select,input,button')?.focus?.();
  }
  async function nextPerson(){const actor=account,id=current?.id,p=params(),query=new URLSearchParams({role:p.get('role')||'worker',status:p.get('status')||'review',q:p.get('q')||'',owner:p.get('owner')||'all',offset:p.get('offset')||0,examples:p.get('examples')||0});let q=await api('?'+query);if(actor!==API.me?.id||!handles()||id!==current?.id)return;const position=q.rows.findIndex(x=>x.id===id);let next=q.rows.slice(position+1).find(x=>['review','ready','blocked'].includes(x.state));if(!next&&q.offset+q.limit<q.total){query.set('offset',String(q.offset+q.limit));q=await api('?'+query);next=q.rows.find(x=>x.id!==id&&['review','ready','blocked'].includes(x.state));}if(actor!==API.me?.id||!handles()||id!==current?.id)return;if(!next){toast('No other office-ready files in this queue. Change the filters to see more.');return;}section='overview';location.hash=url({person:next.id,offset:q.offset||null,status:query.get('status')});}
  async function showSettings(){const actor=account;settingsData=await api('/settings');if(actor!==API.me?.id||!handles())return;const d=settingsData;$('vfDetail').innerHTML=card('Automatic reviewer assignment',form('save-settings',`<p>Choose the reviewers who are available. New office-ready files go to the eligible reviewer with the fewest open files, up to their capacity. Existing assignments are retained.</p><label class="vf-confirm"><input type="checkbox" name="enabled" ${d.enabled?'checked':''}><span>Assign unowned review files automatically</span></label>${field('review_days','Review deadline (business days)',d.review_days,'number','min="1" max="20" required')}<div class="vf-reviewer-settings">${d.reviewers.map(r=>`<fieldset><legend>${esc(r.name)}</legend><label class="vf-confirm"><input name="available:${r.id}" type="checkbox" ${r.available?'checked':''}><span>Available for new reviews</span></label><div class="vf-inline-actions">${['worker','participant'].map(role=>`<label class="vf-confirm"><input name="role:${r.id}:${role}" type="checkbox" ${r.roles.includes(role)?'checked':''}><span>${role==='worker'?'Workers':'Participants'}</span></label>`).join('')}</div>${field('capacity:'+r.id,'Maximum open office files',r.capacity,'number','min="1" max="200" required')}</fieldset>`).join('')}</div>${confirm('I reviewed availability, capacity and deadlines for these reviewers.')}`,'Save automation settings'));
  }
  async function submitSettings(f){const values=Object.fromEntries([...f.elements].filter(x=>x.name).map(x=>[x.name,x.type==='checkbox'?x.checked:x.value])),actor=account,controls=[...f.querySelectorAll('input,select,textarea,button')],out=f.querySelector('.vf-form-result');busy=true;controls.forEach(x=>x.disabled=true);
    try{settingsData=await api('/settings',{enabled:values.enabled===true,review_days:Number(values.review_days),confirm:values.confirm===true,revision:settingsData.revision,reviewers:settingsData.reviewers.map(r=>({id:r.id,available:values['available:'+r.id]===true,capacity:Number(values['capacity:'+r.id]),roles:['worker','participant'].filter(role=>values['role:'+r.id+':'+role])}))});if(actor===API.me?.id&&handles()){out.textContent='Settings saved. Automatic assignment has run.';const input=f.elements.namedItem?.('confirm');if(input)input.checked=false;}}
    catch(e){if(actor===API.me?.id){out.textContent=e.message;out.setAttribute('role','alert');}}finally{busy=false;controls.forEach(x=>{if(x.isConnected)x.disabled=false;});}
  }
  async function pollQueue(){if(polling||busy||!handles()||!API.me?.admin||document.hidden)return;polling=true;const gen=generation,actor=account,id=current?.id,p=params();
    try{const q=await api('?'+new URLSearchParams({role:p.get('role')||'worker',status:p.get('status')||'all',q:p.get('q')||'',owner:p.get('owner')||'all',offset:p.get('offset')||0,examples:p.get('examples')||0}));if(gen!==generation||actor!==API.me?.id||!handles())return;queue=q;if(!document.activeElement?.closest?.('#vfQueue,#vfStats,#vfChips'))paintQueue();
      if(id){const d=await api('/'+id);if(gen!==generation||actor!==API.me?.id||id!==current?.id||!handles())return;if(d.review_token!==current.review_token){const node=$('vfLiveStatus');if(node)node.innerHTML='This person’s file has changed. Your review and draft remain in place. '+button('Reload current evidence','reload');}}
    }catch(e){if(gen===generation&&actor===API.me?.id&&handles()){const node=$('vfLiveStatus');if(node)node.textContent='Live updates paused. Your draft is retained; use Refresh to retry.';}}finally{polling=false;}
  }
  if(typeof setInterval==='function')setInterval(pollQueue,20000);
  const panels={overview:checklist,documents,screening,recruitment,training,plan,history,requests:combinedRequest};
  function draftKey(f){return `${account}:${current?.id}:${f.dataset.vForm}:${f.dataset.document||f.dataset.check||f.dataset.requestKey||''}`;}
  function saveForm(f){const values={};for(const el of f.elements)if(el.name)values[el.name]=el.type==='checkbox'?el.checked:el.value;drafts.set(draftKey(f),values);}
  function restoreDrafts(){for(const f of $('vfDetail')?.querySelectorAll('[data-v-form]')||[]){const values=drafts.get(draftKey(f));if(!values)continue;for(const el of f.elements)if(el.name&&Object.hasOwn(values,el.name)){if(el.type==='checkbox')el.checked=values[el.name];else el.value=values[el.name];}}}
  async function reloadPerson(){if(!current)return;const id=current.id,actor=account,d=await api('/'+id);if(actor!==API.me?.id||Number(params().get('person'))!==id||!handles())return;current=d;clearConfirmations();paintDetail();const p=params();queue=await api('?'+new URLSearchParams({role:p.get('role')||'worker',status:p.get('status')||'all',q:p.get('q')||'',owner:p.get('owner')||'all',offset:p.get('offset')||0,examples:p.get('examples')||0}));if(actor===API.me?.id&&handles())paintQueue();}
  function requestDocument(docKey=''){if(!current)return;const d=current,worker=d.role==='worker';section='documents';$('vfSection').innerHTML=card('Request a document',`<p>Review the wording before sending it to <strong>${esc(d.name)}</strong>.</p>${form('request-document',select(worker?'doc_type':'form_key','Document needed',[['','Choose a document'],...d.catalog.filter(x=>worker||!x.office_only).map(x=>[x.key,x.label])],docKey)+textarea('note','Message to the person','','required minlength="10" maxlength="300" placeholder="Explain what is needed and how they can provide it."')+field('due_date','Requested by (optional)','','date')+confirm('I reviewed the message and want to send this request.'),'Send document request',`data-request-key="${esc(docKey)}"`)}`)+card('Already requested',d.requests.map(x=>`<div class="vf-check-row"><div><strong>${esc(x.label)}</strong><p>${esc(x.note)}</p><small>Requested ${date(x.requested_at)}${x.due_date?' · due '+date(x.due_date):''}</small></div></div>`).join('')||'<p>No open requests.</p>')+button('Back to documents','documents');restoreDrafts();}
  const actions={settings:showSettings,guide:()=>{guided=true;guideNext();},'next-person':nextPerson,'checklist-request':()=>{section='requests';paintDetail();},refresh:()=>render(),documents:()=>{section='documents';paintDetail();},plan:()=>{section='plan';paintDetail();},request:requestDocument,'zoom-in':()=>{viewerZoom=Math.min(2.5,viewerZoom+.25);paintDetail();},'zoom-out':()=>{viewerZoom=Math.max(.5,viewerZoom-.25);paintDetail();},reload:async()=>{for(const value of drafts.values())if('confirm'in value)value.confirm=false;await reloadPerson();}};
  document.addEventListener('click',async ev=>{
    if(!handles())return;const tab=ev.target.closest('[data-v-section]'),doc=ev.target.closest('[data-v-doc]'),b=ev.target.closest('[data-v-action]');
    if(busy&&(tab||doc||b)){ev.preventDefault();return;}
    if(tab){section=tab.dataset.vSection;paintDetail();$('vfDetail')?.querySelector?.('[data-v-section="'+section+'"]')?.focus();return;}if(doc){selectedDoc=Number(doc.dataset.vDoc);viewerZoom=1;paintDetail();$('vfDetail')?.querySelector?.('[data-v-doc="'+selectedDoc+'"]')?.focus();return;}
    if(b&&actions[b.dataset.vAction]){ev.preventDefault();try{await actions[b.dataset.vAction](b.dataset.docKey||'');}catch(err){toast(err.message);}}
  });
  document.addEventListener('error',ev=>{if(!handles()||!ev.target.matches?.('[data-v-evidence-image]'))return;ev.target.hidden=true;const message=ev.target.parentElement?.querySelector('.vf-image-error');if(message)message.hidden=false;},true);
  document.addEventListener('input',ev=>{if(!handles())return;const f=ev.target.closest('[data-v-form]');if(f)saveForm(f);});
  document.addEventListener('change',ev=>{
    if(!handles())return;if(ev.target.id==='vfOwnerFilter')location.hash=url({owner:ev.target.value,offset:null,person:null});if(ev.target.id==='vfExamples')location.hash=url({examples:ev.target.checked?'1':null,offset:null,person:null});
    const f=ev.target.closest('[data-v-form]');if(!f)return;
    if(ev.target.name==='reason_template'){const reasons={unreadable:'The image is not clear enough to read. Please upload a clear photo or scan showing the entire document.',incomplete:'The document appears incomplete. Please provide all pages and the required signatures.',expired:'The document has expired. Please send a current replacement showing its expiry date.',wrong:'This does not appear to be the evidence requested. Please send the correct document for this checklist item.'};if(reasons[ev.target.value])f.elements.reason.value=reasons[ev.target.value];}saveForm(f);
  });
  document.addEventListener('submit',async ev=>{
    if(!handles())return;if(ev.target.id==='vfSearch'){ev.preventDefault();location.hash=url({q:ev.target.elements.q.value.trim(),offset:null,person:null});return;}
    const f=ev.target.closest('[data-v-form]');if(!f)return;ev.preventDefault();if(busy)return;if(f.dataset.vForm==='save-settings'){await submitSettings(f);return;}if(!current)return;saveForm(f);
    const values={...drafts.get(draftKey(f))},action=f.dataset.vForm,id=current.id,actor=API.me.id,key=draftKey(f),out=f.querySelector('.vf-form-result');
    if(action==='request-checklist')values.keys=Object.entries(values).filter(([k,v])=>k.startsWith('item:')&&v===true).map(([k])=>k.slice(5));if(f.dataset.followup)values.id=Number(f.dataset.followup);if(f.dataset.suggestion)values.suggestion_id=Number(f.dataset.suggestion);if(f.dataset.document)values.document_id=Number(f.dataset.document);if(f.dataset.check)values.check_key=f.dataset.check;if(action==='review-plan')values.plan_id=current.plan?.id;if(action==='assign')values.owner_id=Number(values.owner_id)||null;
    const controls=[...f.querySelectorAll('input,select,textarea,button')];busy=true;controls.forEach(el=>el.disabled=true);out.textContent='Saving your review…';
    try{await api('/'+id+'/action',{action,review_token:current.review_token,values});drafts.delete(key);if(actor!==API.me?.id||id!==Number(params().get('person'))||!handles())return;
      if(action==='verify-document'){const next=current.documents.find(x=>x.id!==selectedDoc&&!x.verified_at&&!x.accepted_at&&!['rejected','superseded'].includes(x.review)&&x.has_file);selectedDoc=next?.id||selectedDoc;}

  });
  return {handles,render,view:{shell,checklist,documents,screening,recruitment,training,plan,history,combinedRequest,planChangesPanel},pollQueue,setPreview(d,q){current=d;queue=q;account=1;selectedDoc=d.documents[0]?.id;return {shell:shell(),checklist:checklist(),documents:documents()};}};
})();
</script><script>if(!location.hash.startsWith("#/admin/verification"))location.hash="#/admin/verification?role=worker&person=15";CareVerify.render();</script></body></html>
