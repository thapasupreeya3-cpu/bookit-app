<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Care Web — clear task examples v88.3.3</title><style>
/* ============ Design tokens ============ */
:root{
  color-scheme:light;
  --ink:#1B2440;
  --ink-soft:#4A5570;
  --teal:#203566;
  --teal-deep:#15264D;
  --teal-tint:#EDF1F8;
  --coral:#C8462E;
  --coral-tint:#FCE9E3;
  --amber:#F1BE48;
  --amber-tint:#FDF3DC;
  --cream:#FBF9F5;
  --navy:#203566; --navy-deep:#15264D; --navy-light:#4A66A8; --navy-tint:#DCE6F8;
  --gold:#F1BE48; --gold-tint:#FDF3DC; --silver:#BDC3CC; --silver-tint:#EEF0F3;
  --text:#1B2440; --text-soft:#4A5570; --text-muted:#6B7590;
  --card:#FFFFFF;
  --line:#E2E0DA;
  --ok:#1F7A4D;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 30px rgba(25,43,78,.08);
  --shadow-lg:0 18px 50px rgba(25,43,78,.14);
  --fs:1rem;
  --font-head:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --maxw:1160px;
}
/* user text-size setting (accessibility panel) */
html[data-fs="100"]{font-size:100%;}
html[data-fs="115"]{font-size:115%;}
html[data-fs="130"]{font-size:130%;}
html[data-fs="150"]{font-size:150%;}
/* easier-to-read font mode */
html[data-font="readable"]{
  --font-head:Verdana,'Trebuchet MS',Tahoma,sans-serif;
  --font-body:Verdana,'Trebuchet MS',Tahoma,sans-serif;
}
html[data-font="readable"] body{line-height:1.9;letter-spacing:.02em;word-spacing:.1em;}
html[data-font="readable"] h1,html[data-font="readable"] h2,html[data-font="readable"] h3,html[data-font="readable"] h4{letter-spacing:0;line-height:1.35;}
html[data-font="readable"] p{margin-bottom:.6em;}
/* manual reduce-motion (in addition to the OS preference below) */
html[data-motion="reduce"]{scroll-behavior:auto;}
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{animation:none!important;transition:none!important;}
/* high contrast mode */
html.high-contrast{
  --ink:#000000; --ink-soft:#000000; --teal:#00443c; --teal-deep:#00291f;
  --teal-tint:#ffffff; --coral:#8a0000; --coral-tint:#ffffff; --cream:#ffffff;
  --card:#ffffff; --line:#000; --amber:#8a6d00; --amber-tint:#ffffff;
  --shadow:none; --shadow-lg:none;
}
html.high-contrast body{background:#fff;}
html.high-contrast .btn-primary{background:#000;border-color:#000;}
html.high-contrast .hero{background:#fff;}
html.high-contrast a{text-decoration:underline!important;}
html.high-contrast .btn,html.high-contrast .chip,html.high-contrast .kicker{text-decoration:none!important;}
html.high-contrast .service-card,html.high-contrast .info-card,html.high-contrast .worker-card,
html.high-contrast .step,html.high-contrast .testi,html.high-contrast .faq-item,html.high-contrast .form-card,
html.high-contrast .ph-card,html.high-contrast .compare-card,html.high-contrast .table-wrap,
html.high-contrast .filter-bar,html.high-contrast .msg-layout,html.high-contrast .fund-box,
html.high-contrast .path-card,html.high-contrast .success-box{border:2px solid #000!important;box-shadow:none!important;}
html.high-contrast :focus-visible{outline:4px solid #000!important;outline-offset:3px;background-color:#ffef9c;}

*{margin:0;padding:0;box-sizing:border-box;}
[hidden]{display:none!important;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation:none!important;transition:none!important;}
}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--cream);
  line-height:1.65;
  font-size:var(--fs);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.18;letter-spacing:-.015em;}
h1{font-size:clamp(2.1rem,4.6vw,3.4rem);font-weight:800;}
h2{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:700;}
h3{font-size:1.22rem;font-weight:700;}
p{color:var(--ink-soft);}
a{color:var(--teal);}
img,svg{max-width:100%;display:block;}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
.container.narrow{max-width:820px;}
section.block{padding:76px 0;}
.center{text-align:center;}
.kicker{
  display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--teal);background:var(--teal-tint);
  padding:6px 14px;border-radius:999px;margin-bottom:16px;
}
.lead{font-size:1.13rem;max-width:46em;}
.center .lead{margin-left:auto;margin-right:auto;}
.section-head{max-width:720px;margin:0 auto 44px;text-align:center;}
.section-head p{margin-top:12px;}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-body);font-weight:600;font-size:1rem;
  padding:13px 26px;border-radius:999px;border:2px solid transparent;
  cursor:pointer;text-decoration:none;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-deep);transform:translateY(-1px);box-shadow:var(--shadow);}
.btn-secondary{background:#fff;color:var(--teal);border-color:var(--teal);}
.btn-secondary:hover{background:var(--teal-tint);transform:translateY(-1px);}
.btn-coral{background:var(--coral);color:#fff;}
.btn-coral:hover{filter:brightness(.93);transform:translateY(-1px);box-shadow:var(--shadow);}
.btn-ghost{background:transparent;color:var(--ink);font-weight:600;padding:10px 16px;}
.btn-ghost:hover{background:var(--teal-tint);color:var(--teal-deep);border-radius:999px;}
.btn-lg{padding:16px 34px;font-size:1.08rem;}
.btn-sm{padding:8px 18px;font-size:.9rem;}

/* ============ Skip link & a11y bar ============ */
.skip-link{
  position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;
  padding:12px 20px;z-index:200;border-radius:0 0 12px 0;font-weight:600;
}
.skip-link:focus{left:0;}
.a11y-open{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--amber);border:1px solid var(--amber);color:var(--ink);
  border-radius:999px;padding:4px 16px;font-size:.85rem;cursor:pointer;font-family:var(--font-body);font-weight:700;
}
.a11y-open:hover{background:#fff;}
.a11y-open svg{width:16px;height:16px;}
.a11y-open:focus-visible{outline:3px solid #fff;outline-offset:2px;}
/* accessibility panel */
.a11y-panel{display:none;background:var(--card);border-bottom:2px solid var(--line);}
.a11y-panel.open{display:block;}
.a11y-panel .container{padding-top:22px;padding-bottom:22px;}
.a11y-panel h2{font-size:1.1rem;margin-bottom:14px;display:flex;align-items:center;gap:9px;}
.a11y-panel h2 svg{width:21px;height:21px;color:var(--teal);}
.a11y-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:860px){.a11y-groups{grid-template-columns:1fr;}}
.a11y-group{background:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;}
.a11y-group h3{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-deep);margin-bottom:10px;}
.a11y-group .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.tool-btn{
  background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;
  padding:7px 15px;font-size:.87rem;cursor:pointer;font-family:var(--font-body);font-weight:600;
}
.tool-btn:hover{border-color:var(--teal);}
.tool-btn[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal);}
.tool-btn[aria-pressed="true"]:not(.no-tick)::before{content:"✓ ";}
.tool-btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
.tool-btn:disabled{opacity:.45;cursor:not-allowed;}
.fs-readout{font-weight:800;min-width:52px;text-align:center;font-variant-numeric:tabular-nums;}
.a11y-close-row{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;}
.a11y-close-row .links{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.85rem;}
.a11y-hint{font-size:.8rem;color:var(--ink-soft);margin-top:8px;}

/* ============ Header ============ */
header.site{
  position:sticky;top:0;z-index:100;background:rgba(250,246,240,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
html.high-contrast header.site{background:#fff;}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:var(--maxw);margin:0 auto;gap:16px;}
.logo{display:flex;align-items:center;gap:2px;text-decoration:none;color:var(--ink);font-family:var(--font-head);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;}
.logo svg.oo{height:.68em;width:auto;flex:none;margin:.12em 4px 0 0;}
.logo .wm{display:inline-flex;align-items:baseline;letter-spacing:-.02em}
.logo .wm-the{font-weight:500;opacity:.72;margin-right:.08em}
.logo .wm-web{font-weight:500;opacity:.72;margin-left:.06em}
nav.main{display:flex;align-items:center;gap:4px;}
nav.main > ul{display:flex;list-style:none;gap:2px;align-items:center;}
nav.main a.nav-link, nav.main button.nav-link{
  display:block;padding:9px 14px;border-radius:10px;text-decoration:none;color:var(--ink);
  font-weight:600;font-size:.96rem;background:none;border:none;cursor:pointer;font-family:var(--font-body);
}
nav.main a.nav-link:hover, nav.main button.nav-link:hover{background:var(--teal-tint);color:var(--teal-deep);}
nav.main a.nav-link[aria-current="page"]{color:var(--teal);background:var(--teal-tint);}
nav.main a.nav-link:focus-visible, nav.main button.nav-link:focus-visible{outline:3px solid var(--amber);outline-offset:1px;}
.nav-cta{display:flex;gap:10px;align-items:center;}
.dropdown{position:relative;}
.dropdown .caret{display:inline-block;transition:transform .15s;margin-left:4px;font-size:.7em;}
.dropdown.open .caret{transform:rotate(180deg);}
.dropdown-menu{
  position:absolute;top:calc(100% + 8px);left:0;background:var(--card);min-width:290px;
  border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--line);
  padding:8px;display:none;z-index:120;
}
.dropdown.open .dropdown-menu{display:block;}
.dropdown-menu a{
  display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:10px;
  text-decoration:none;color:var(--ink);
}
.dropdown-menu a:hover{background:var(--teal-tint);}
.dropdown-menu a:focus-visible{outline:3px solid var(--amber);outline-offset:-2px;}
.dropdown-menu .mi{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--teal-tint);color:var(--teal);}
.dropdown-menu .mi svg{width:19px;height:19px;}
.dropdown-menu b{display:block;font-size:.93rem;}
.dropdown-menu small{color:var(--ink-soft);font-size:.8rem;line-height:1.35;display:block;}
.burger{display:none;background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;}
.burger svg{width:26px;height:26px;stroke:var(--ink);}
.burger:focus-visible{outline:3px solid var(--amber);}
@media (max-width:1020px){
  header.site{backdrop-filter:none;background:var(--cream);}
  nav.main{
    display:none;position:fixed;inset:0;top:0;background:var(--cream);z-index:150;
    padding:80px 26px 26px;overflow:auto;
  }
  nav.main.open{display:block;}
  nav.main > ul{flex-direction:column;align-items:stretch;gap:4px;}
  nav.main a.nav-link, nav.main button.nav-link{font-size:1.15rem;padding:13px 14px;}
  .dropdown-menu{position:static;box-shadow:none;border:none;background:var(--teal-tint);margin-top:4px;}
  .nav-close{display:flex!important;position:absolute;top:18px;right:20px;}
  .burger{display:block;}
  .nav-cta .btn-ghost{display:none;}
}
.nav-close{display:none;background:none;border:none;cursor:pointer;padding:8px;}
.nav-mobile-only{display:none;}
@media (max-width:1020px){.nav-mobile-only{display:block;}}
.nav-close svg{width:26px;height:26px;stroke:var(--ink);}

/* ============ Account chip + menu (logged in) ============ */
.acct{position:relative;}
.acct-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--card);
  border:1.5px solid var(--line);border-radius:999px;padding:4px 9px 4px 4px;
  cursor:pointer;font:inherit;transition:border-color .15s, box-shadow .15s;
}
.acct-chip:hover{border-color:var(--teal);}
.acct-chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
.acct.open .acct-chip{border-color:var(--teal);box-shadow:0 0 0 3px rgba(32,53,102,.14);}
/* v86.5 — the compliance tabs */
.cmp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;border-bottom:2px solid var(--line);padding-bottom:0;}
.cmp-tab{font:inherit;font-weight:700;font-size:.92rem;background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;color:var(--ink-soft);margin-bottom:-2px;}
.cmp-tab.on{color:var(--teal);border-bottom-color:var(--teal);}
.cmp-tab .cmp-n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#C8462E;color:#fff;font-size:.72rem;margin-left:6px;}
.cmp-search{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 14px;}
.cmp-search input{font:inherit;font-size:1rem;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;min-width:min(420px,100%);}
.adm-fold > summary{cursor:pointer;list-style:none;} .adm-fold > summary::-webkit-details-marker{display:none;}
.adm-fold > summary .adm-section{display:inline-block;margin:0;} .adm-fold > summary::before{content:'▸ ';color:var(--teal);font-weight:700;} .adm-fold[open] > summary::before{content:'▾ ';}
/* v86.4 — red marks for anything that blocks the next shift */
.acct-chip{position:relative;}
.acct-dot{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:999px;background:#C8462E;border:2px solid var(--cream);}
.acct-dot[hidden]{display:none;}
.nav-dot{display:inline-block;width:9px;height:9px;border-radius:999px;background:#C8462E;margin-left:6px;vertical-align:middle;}
.sr-badge{background:#C8462E;color:#fff;font-size:.72rem;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;margin-left:8px;vertical-align:middle;}
.sr-badge[hidden],.acct-badge[hidden]{display:none;}
.acct-badge.red{background:#C8462E;}
.blk-panel{border:2px solid #C8462E;border-radius:14px;padding:12px 14px;margin:0 0 14px;background:rgba(200,70,46,.06);}
.blk-panel h4{margin:0 0 6px;color:#9E2F1C;font-size:.95rem;}
.blk-panel p{margin:4px 0;font-size:.92rem;}
.blk-panel a{font-weight:700;}
.pdoc-grp.mine.pdoc-grp-must,.pdoc-grp-must{border:2px solid #C8462E;border-left:2px solid #C8462E;border-radius:14px;padding:10px 14px;margin:0 0 14px;background:rgba(200,70,46,.05);}
.pdoc-grp-must .pdoc-grp-h{color:#9E2F1C;}
.btn[disabled],.btn:disabled{opacity:.45;cursor:not-allowed;}
.accept-why{display:block;color:#9E2F1C;font-size:.84rem;font-weight:700;margin:6px 0 0;}
.acct-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;
  font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex:none;letter-spacing:.02em;
}
.acct-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.acct-caret{width:14px;height:14px;color:var(--ink-soft);transition:transform .18s;flex:none;}
.acct.open .acct-caret{transform:rotate(180deg);}
.acct-menu{
  position:absolute;top:calc(100% + 12px);right:0;width:296px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  overflow:hidden;z-index:220;
  display:flex;flex-direction:column;
  max-height:calc(100vh - 96px);max-height:calc(100dvh - 96px);
}
.acct-menu > .acct-head,.acct-menu > .acct-sep,.acct-menu > .acct-foot{flex:none;}
.acct-menu > .acct-items{flex:0 1 auto;min-height:76px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;}
.acct-menu > .acct-items::-webkit-scrollbar{width:8px;}
.acct-menu > .acct-items::-webkit-scrollbar-thumb{background:#CBBFAE;border-radius:99px;border:2px solid var(--card);}
.acct-menu > .acct-sep + .acct-items{flex:none;overflow:visible;min-height:0;}
.acct-head{display:flex;gap:12px;align-items:center;padding:15px 16px;background:var(--cream);border-bottom:1px solid var(--line);}
.wc-avatar.acct-big{width:46px;height:46px;font-size:1rem;flex:none;}
.acct-who{display:flex;flex-direction:column;gap:2px;min-width:0;}
.acct-who b{font-family:var(--font-head);font-size:1.04rem;line-height:1.2;}
.acct-role{font-size:.78rem;color:var(--ink-soft);font-weight:600;}
.acct-live{color:var(--ok);font-weight:700;}
.acct-wait{color:#8a6d00;font-weight:700;}
.acct-items{padding:7px;}
.acct-item{
  display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
  font:inherit;font-size:.93rem;font-weight:600;color:var(--ink);padding:8px 9px;
  border-radius:var(--radius-sm);cursor:pointer;text-align:left;
}
.acct-item:hover{background:var(--teal-tint);color:var(--teal-deep);}
.acct-item:focus-visible{outline:3px solid var(--amber);outline-offset:-2px;}
.acct-menu .mi{width:31px;height:31px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--teal-tint);color:var(--teal);}
.acct-menu .mi svg{width:16px;height:16px;}
.acct-item:hover .mi{background:var(--card);}
.acct-badge{
  margin-left:auto;background:var(--coral);color:#fff;font-size:.72rem;font-weight:800;
  min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none;
}
.acct-pill{
  margin-left:auto;background:var(--teal);color:#fff;font-size:.66rem;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px;flex:none;
}
.acct-sep{height:1px;background:var(--line);margin:0 16px;}
.acct-item.acct-out{color:#9E2F1C;}
.acct-item.acct-out .mi{background:var(--coral-tint);color:var(--coral);}
.acct-item.acct-out:hover{background:var(--coral-tint);color:var(--coral);}
.acct-foot{
  padding:8px 16px 11px;font-size:.74rem;color:var(--ink-soft);border-top:1px solid var(--line);
  background:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
html.high-contrast .acct-menu{border:2px solid #000;box-shadow:none;}
html.high-contrast .acct-chip{border-color:#000;}
@media (max-width:640px){
  .acct-menu{position:fixed;left:12px;right:12px;top:72px;width:auto;
    max-height:calc(100vh - 84px);max-height:calc(100dvh - 84px);}
  .acct-item{padding:7px 8px;font-size:.92rem;}
  .acct-head{padding:12px 14px;}
  .acct-menu .mi{width:29px;height:29px;}
}
/* gentle highlight when the account menu deep-links to a card */
.sec-flash{animation:secFlash 1.7s ease;}
@keyframes secFlash{0%{box-shadow:0 0 0 4px rgba(32,53,102,.5);}100%{box-shadow:0 0 0 4px rgba(32,53,102,0);}}

/* ============ Hero ============ */
.hero{
  background:
    radial-gradient(900px 420px at 88% -10%, rgba(241,190,72,.22), transparent 60%),
    radial-gradient(700px 420px at -8% 110%, rgba(32,53,102,.14), transparent 60%),
    var(--cream);
  padding:74px 0 60px;overflow:hidden;
}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}
.hero h1 .u{position:relative;white-space:nowrap;}
.hero h1 .u::after{
  content:"";position:absolute;left:0;right:0;bottom:.06em;height:.34em;
  background:var(--amber);z-index:-1;border-radius:4px;opacity:.65;
}
.hero .lead{margin:20px 0 28px;}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
.hero-search{
  display:flex;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:999px;
  padding:8px 8px 8px 22px;max-width:470px;box-shadow:var(--shadow);align-items:center;
}
.hero-search svg{width:20px;height:20px;color:var(--teal);flex:none;}
.hero-search input{
  border:none;outline:none;flex:1;font-size:1rem;font-family:var(--font-body);background:transparent;color:var(--ink);min-width:0;
}
.hero-search input:focus-visible{outline:none;}
.hero-search:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(32,53,102,.15);}
.hero-note{font-size:.85rem;color:var(--ink-soft);margin-top:10px;}
.trust-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}
.chip{
  display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  padding:8px 15px;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--ink);
}
.chip svg{width:16px;height:16px;color:var(--ok);flex:none;}

/* hero illustration */
.hero-art{position:relative;}
.hero-art .art-main{width:100%;height:auto;border-radius:26px;box-shadow:var(--shadow-lg);}
.float-card{
  position:absolute;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);
  padding:12px 16px;display:flex;gap:11px;align-items:center;border:1px solid var(--line);
}
.float-card .avatar{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:.95rem;}
.float-card b{font-size:.9rem;display:block;line-height:1.25;}
.float-card small{font-size:.76rem;color:var(--ink-soft);display:block;line-height:1.3;}
.fc1{top:-18px;right:8px;animation:floaty 5s ease-in-out infinite;}
.fc2{top:45%;left:-10px;animation:floaty 6s ease-in-out infinite reverse;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:900px){.fc2{left:0;} .hero{padding-top:48px;}}

/* ============ Stats / value strip ============ */
.value-strip{background:var(--teal);color:#fff;}
.value-strip .container{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-top:34px;padding-bottom:34px;}
@media (max-width:900px){.value-strip .container{grid-template-columns:repeat(2,1fr);}}
.value-item{display:flex;gap:13px;align-items:flex-start;}
.value-item svg{width:26px;height:26px;flex:none;color:var(--amber);margin-top:2px;}
.value-item b{display:block;font-family:var(--font-head);font-size:1rem;}
.value-item small{opacity:.85;font-size:.84rem;line-height:1.45;display:block;}

/* ============ Services grid ============ */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:960px){.services-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.services-grid{grid-template-columns:1fr;}}
.service-card{
  background:var(--card);border-radius:var(--radius);padding:28px;border:1px solid var(--line);
  box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:12px;
  transition:transform .18s ease, box-shadow .18s ease;position:relative;
}
.service-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);}
.service-card:focus-visible{outline:3px solid var(--amber);outline-offset:3px;}
.service-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.service-icon svg{width:27px;height:27px;}
.service-card h3{font-size:1.15rem;}
.service-card p{font-size:.93rem;line-height:1.55;flex:1;}
.service-card .code{
  font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);
  background:var(--cream);border:1px solid var(--line);padding:3px 10px;border-radius:999px;align-self:flex-start;
}
.service-card .go{font-weight:700;color:var(--teal);font-size:.92rem;display:inline-flex;align-items:center;gap:6px;}
.ic-teal{background:var(--teal-tint);color:var(--teal);}
.ic-coral{background:var(--coral-tint);color:var(--coral);}
.ic-amber{background:var(--amber-tint);color:#8a6d00;}

/* ============ Steps ============ */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:step;}
@media (max-width:860px){.steps{grid-template-columns:1fr;}}
.step{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:30px;box-shadow:var(--shadow);position:relative;}
.step .num{
  width:46px;height:46px;border-radius:50%;background:var(--amber);color:var(--ink);
  font-family:var(--font-head);font-weight:800;font-size:1.25rem;display:flex;align-items:center;justify-content:center;margin-bottom:18px;
}
.step h3{margin-bottom:10px;}
.step p{font-size:.95rem;}
.step ul{margin:12px 0 0 18px;color:var(--ink-soft);font-size:.9rem;}
.step ul li{margin-bottom:6px;}

/* ============ Tables ============ */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card);}
table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:640px;}
caption{text-align:left;padding:18px 22px 6px;font-weight:700;font-family:var(--font-head);font-size:1.05rem;color:var(--ink);}
th,td{padding:13px 22px;text-align:left;border-bottom:1px solid var(--line);}
thead th{background:var(--teal);color:#fff;font-family:var(--font-head);font-weight:600;font-size:.87rem;letter-spacing:.02em;border-bottom:none;}
thead th small{display:block;font-weight:400;opacity:.8;font-size:.75rem;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even){background:var(--cream);}
html.high-contrast tbody tr:nth-child(even){background:#f0f0f0;}
td b{font-variant-numeric:tabular-nums;}
.good{color:var(--ok);font-weight:700;}
.tbl-note{font-size:.83rem;color:var(--ink-soft);margin-top:14px;max-width:60em;}

/* ============ Split / why us ============ */
.split{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center;}
@media (max-width:900px){.split{grid-template-columns:1fr;gap:30px;}}
.tick-list{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px;}
.tick-list li{display:flex;gap:13px;align-items:flex-start;}
.tick-list svg{width:23px;height:23px;color:var(--ok);flex:none;margin-top:2px;}
.tick-list b{display:block;}
.tick-list span{color:var(--ink-soft);font-size:.94rem;}
.compare-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden;}
.compare-card .cc-head{background:var(--teal);color:#fff;padding:18px 26px;font-family:var(--font-head);font-weight:700;}
.compare-card .cc-body{padding:10px 26px 22px;}
.compare-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line);font-size:.95rem;align-items:baseline;}
.compare-row:last-child{border-bottom:none;}
.compare-row b{font-variant-numeric:tabular-nums;white-space:nowrap;}

/* ============ Worker cards ============ */
.worker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:960px){.worker-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.worker-grid{grid-template-columns:1fr;}}
.worker-card{
  background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);
  padding:24px;display:flex;flex-direction:column;gap:13px;transition:transform .18s ease, box-shadow .18s ease;
}
.worker-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.wc-top{display:flex;gap:15px;align-items:center;}
.wc-avatar{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.25rem;font-family:var(--font-head);flex:none;overflow:hidden;}
.wc-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.wc-name{font-family:var(--font-head);font-weight:700;font-size:1.08rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.wc-name svg{width:17px;height:17px;color:var(--teal);}
.wc-meta{font-size:.84rem;color:var(--ink-soft);}
.wc-bio{font-size:.92rem;color:var(--ink-soft);line-height:1.55;flex:1;}
.wc-tags{display:flex;flex-wrap:wrap;gap:7px;}
.wc-tag{background:var(--teal-tint);color:var(--teal-deep);font-size:.75rem;font-weight:600;padding:4px 11px;border-radius:999px;}
.wc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;}
.wc-rate{font-size:.85rem;color:var(--ink-soft);}
.wc-rate b{color:var(--ink);font-size:1.02rem;}

/* browse filters */
.filter-bar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:30px;
}
.filter-bar label{font-weight:600;font-size:.88rem;}
.filter-bar select,.filter-bar input[type=search]{
  font-family:var(--font-body);font-size:.95rem;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;color:var(--ink);min-width:170px;
}
.filter-bar select:focus-visible,.filter-bar input:focus-visible{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--teal);}
.filter-count{margin-left:auto;font-size:.9rem;color:var(--ink-soft);font-weight:600;}
@media (max-width:640px){.filter-count{margin-left:0;}}

/* ============ Testimonials ============ */
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:900px){.testi-grid{grid-template-columns:1fr;}}
.testi{
  background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);
  padding:28px;display:flex;flex-direction:column;gap:16px;
}
.testi .stars{color:var(--amber);letter-spacing:3px;font-size:1.05rem;}
.testi blockquote{font-size:.98rem;color:var(--ink);line-height:1.6;flex:1;font-style:normal;}
.testi .who{display:flex;gap:12px;align-items:center;}
.testi .who .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;}
.testi .who b{display:block;font-size:.93rem;}
.testi .who small{color:var(--ink-soft);font-size:.8rem;}

/* ============ Banner CTA ============ */
.banner{
  background:linear-gradient(120deg,var(--teal) 0%,var(--teal-deep) 100%);
  border-radius:26px;color:#fff;padding:56px 48px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;
  position:relative;overflow:hidden;
}
.banner::after{
  content:"";position:absolute;right:-70px;top:-70px;width:270px;height:270px;border-radius:50%;
  background:rgba(241,190,72,.25);
}
.banner h2{color:#fff;}
.banner p{color:rgba(255,255,255,.85);margin-top:12px;}
.banner .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1;}
@media (max-width:820px){.banner{grid-template-columns:1fr;padding:40px 28px;} .banner .btns{justify-content:flex-start;}}
.banner .btn-primary{background:var(--amber);color:var(--ink);}
.banner .btn-primary:hover{background:#fff;}
.banner .btn-secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.7);}
.banner .btn-secondary:hover{background:rgba(255,255,255,.12);}

/* ============ FAQ accordion ============ */
.faq-list{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.faq-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow);overflow:hidden;}
.faq-item summary{
  list-style:none;cursor:pointer;padding:19px 24px;font-weight:700;font-family:var(--font-head);font-size:1rem;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item summary .plus{flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal-tint);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;transition:transform .2s;}
.faq-item[open] summary .plus{transform:rotate(45deg);background:var(--coral-tint);color:var(--coral);}
.faq-item summary:focus-visible{outline:3px solid var(--amber);outline-offset:-3px;}
.faq-item .faq-body{padding:0 24px 20px;color:var(--ink-soft);font-size:.95rem;}
.faq-item .faq-body a{font-weight:600;}

/* ============ Page hero (inner pages) ============ */
.page-hero{
  background:
    radial-gradient(700px 300px at 92% 0%, rgba(241,190,72,.18), transparent 60%),
    var(--teal-tint);
  padding:58px 0 46px;
}
.page-hero h1{font-size:clamp(1.9rem,3.6vw,2.7rem);max-width:18em;}
.page-hero .lead{margin-top:14px;}
.breadcrumb{font-size:.85rem;margin-bottom:18px;color:var(--ink-soft);}
.breadcrumb a{color:var(--teal);font-weight:600;text-decoration:none;}
.breadcrumb a:hover{text-decoration:underline;}

/* service detail layout */
.svc-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:start;}
@media (max-width:900px){.svc-layout{grid-template-columns:1fr;}}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;}
.info-card + .info-card{margin-top:22px;}
.info-card h3{margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.info-card h3 svg{width:22px;height:22px;color:var(--teal);flex:none;}
.info-card ul{margin:0 0 0 20px;color:var(--ink-soft);font-size:.95rem;}
.info-card ul li{margin-bottom:8px;}
.fund-box{background:var(--amber-tint);border:1px solid #eeda9f;border-radius:var(--radius);padding:24px;}
.fund-box h3{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:1.05rem;}
.fund-box p{font-size:.9rem;}
.fund-box .code-line{font-size:.82rem;background:#fff;border:1px solid #eeda9f;border-radius:8px;padding:8px 12px;margin-top:10px;font-weight:600;color:var(--ink);}

/* two-col checklists */
.cols-2{columns:2;column-gap:40px;}
@media (max-width:700px){.cols-2{columns:1;}}

/* pricing highlight card */
.price-hero-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;}
@media (max-width:860px){.price-hero-cards{grid-template-columns:1fr;}}
.ph-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;text-align:center;}
.ph-card .big{font-family:var(--font-head);font-size:2.1rem;font-weight:800;color:var(--teal);}
.ph-card .big sup{font-size:1rem;font-weight:600;}
.ph-card p{font-size:.88rem;margin-top:6px;}
.ph-card .tag{display:inline-block;background:var(--teal-tint);color:var(--teal-deep);font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:12px;}

/* ============ Forms / signup ============ */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:36px;max-width:640px;margin:0 auto;}
.form-card h2{margin-bottom:8px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:7px;}
.field.full{grid-column:1/-1;}
.field label{font-weight:600;font-size:.9rem;}
.field input,.field select,.field textarea{
  font-family:var(--font-body);font-size:1rem;padding:12px 15px;border-radius:11px;border:1.5px solid var(--line);
  background:#fff;color:var(--ink);width:100%;
}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--teal);}
.field .hint{font-size:.8rem;color:var(--ink-soft);}
.choice-row{display:flex;gap:12px;flex-wrap:wrap;}
.choice-pill{position:relative;}
.choice-pill input{position:absolute;opacity:0;inset:0;cursor:pointer;}
.choice-pill span{
  display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:9px 18px;font-size:.9rem;font-weight:600;cursor:pointer;
}
.choice-pill input:checked + span{background:var(--teal);border-color:var(--teal);color:#fff;}
.choice-pill input:focus-visible + span{outline:3px solid var(--amber);outline-offset:2px;}
.path-cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:820px;margin:0 auto;}
@media (max-width:700px){.path-cards{grid-template-columns:1fr;}}
.path-card{
  background:var(--card);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:32px;text-align:left;cursor:pointer;font-family:var(--font-body);transition:border-color .15s, transform .15s;
}
.path-card:hover{border-color:var(--teal);transform:translateY(-3px);}
.path-card:focus-visible{outline:3px solid var(--amber);outline-offset:3px;}
.path-card .service-icon{margin-bottom:16px;}
.path-card h3{margin-bottom:8px;}
.path-card p{font-size:.93rem;}
.success-box{
  background:var(--teal-tint);border:1px solid #DCE6F8;border-radius:var(--radius);padding:36px;text-align:center;max-width:640px;margin:0 auto;
}
.success-box svg{width:56px;height:56px;color:var(--ok);margin:0 auto 16px;}
.form-note{font-size:.8rem;color:var(--ink-soft);margin-top:16px;}

/* ============ Modal ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(27,36,64,.55);z-index:300;display:none;
  align-items:flex-start;justify-content:center;padding:40px 18px;overflow:auto;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);max-width:560px;width:100%;
  padding:34px;position:relative;margin:auto 0;
}
.modal .close-x{
  position:absolute;top:16px;right:16px;background:var(--cream);border:1px solid var(--line);width:38px;height:38px;
  border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--ink);display:flex;align-items:center;justify-content:center;
}
.modal .close-x:focus-visible{outline:3px solid var(--amber);}
.modal h2{font-size:1.5rem;margin-bottom:6px;}
.modal .form-grid{grid-template-columns:1fr;}
.avail-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;}
.avail-grid .d{font-size:.72rem;font-weight:700;text-align:center;color:var(--ink-soft);}
.avail-grid .dot{height:26px;border-radius:7px;background:var(--cream);border:1px solid var(--line);}
.avail-grid .dot.on{background:var(--teal);border-color:var(--teal);}

/* ============ Worker profile page ============ */
.wp-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start;}
@media (max-width:940px){.wp-layout{grid-template-columns:1fr;}}
.wp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);margin-bottom:20px;}
.wp-card h2{font-size:1.22rem;margin-bottom:14px;}
/* Profile tabs — one screen, not one long scroll. The header card stays put;
   everything below it lives behind a tab, so nothing runs off the page. */
.wp-tabbar{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:20px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none;}
.wp-tabbar::-webkit-scrollbar{display:none;}
.wp-tab{font:inherit;font-size:.92rem;font-weight:700;color:var(--ink-soft);background:transparent;border:none;border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;flex:1;transition:background .15s,color .15s;}
.wp-tab:hover{color:var(--teal-deep);}
.wp-tab[aria-selected="true"]{background:var(--teal);color:#fff;}
.wp-tab:focus-visible{outline:3px solid var(--amber);outline-offset:1px;}
.wp-pane{display:none;}
.wp-pane.on{display:block;animation:paneIn .18s ease;}
/* Account profile: identity rail on the left, tabbed content on the right —
   the page reads across the screen instead of running down it. */
.ap-layout{display:grid;grid-template-columns:288px minmax(0,1fr);gap:24px;align-items:start;}
.ap-side{position:sticky;top:86px;}
@media (max-width:880px){.ap-layout{grid-template-columns:1fr;}.ap-side{position:static;}.ap-side .info-card{margin-bottom:14px;}}
@keyframes paneIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.wp-pane.on{animation:none;}}
@media (max-width:560px){.wp-tab{flex:none;padding:9px 14px;}}
.wp-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.wp-hero .wc-avatar{width:116px;height:116px;font-size:2.2rem;border:4px solid var(--teal-tint);}
.wp-name{display:flex;align-items:center;gap:9px;font-size:1.75rem;margin:0;flex-wrap:wrap;}
.wp-name svg{width:23px;height:23px;color:var(--teal);flex:none;}
.wp-stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:20px;width:100%;}
.wp-stat{flex:1;min-width:105px;text-align:center;padding:13px 8px;background:var(--cream);}
.wp-stat + .wp-stat{border-left:1px solid var(--line);}
.wp-stat b{display:block;font-family:var(--font-head);font-size:1.12rem;color:var(--teal-deep);}
.wp-stat span{font-size:.75rem;color:var(--ink-soft);font-weight:600;}
.wp-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.wp-fact small{display:block;color:var(--ink-soft);font-size:.78rem;font-weight:600;margin-bottom:2px;}
.wp-fact b{font-size:.95rem;}
.wp-svc{display:flex;gap:13px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);}
.wp-svc:last-of-type{border-bottom:none;}
.wp-svc:hover b{color:var(--teal);}
.wp-svc .mi{width:38px;height:38px;flex:none;border-radius:10px;background:var(--teal-tint);color:var(--teal);display:flex;align-items:center;justify-content:center;}
.wp-svc .mi svg{width:20px;height:20px;}
.wp-svc b{display:block;font-size:.97rem;}
.wp-svc small{color:var(--ink-soft);font-size:.85rem;}
.cred-line{display:flex;gap:11px;align-items:flex-start;padding:8px 0;}
.cred-line > svg{width:20px;height:20px;color:var(--ok);flex:none;margin-top:3px;}
.cred-line small{display:block;color:var(--ink-soft);font-size:.82rem;}
.cred-badge{display:inline-block;background:#E1F3E7;color:#1F7A4D;border:1px solid #1F7A4D;font-size:.66rem;font-weight:800;letter-spacing:.03em;padding:1px 8px;border-radius:999px;margin-left:7px;vertical-align:2px;text-transform:uppercase;}
.cred-badge.demo{background:#FFF3D6;color:#8a6d00;border-color:#F1BE48;}
.wc-demo{display:inline-block;background:#FFF3D6;color:#8a6d00;border:1px solid #F1BE48;font-size:.62rem;font-weight:800;letter-spacing:.04em;padding:1px 7px;border-radius:999px;margin-left:7px;vertical-align:3px;text-transform:uppercase;}
.demo-note{background:#FFF8E8;border:1.5px solid #F1BE48;border-radius:12px;padding:10px 16px;margin-top:12px;font-size:.95rem;color:#5a4a12;}
/* a check we have NOT satisfied ourselves never gets the green shield */
.cred-line-no > svg{color:#9E2F1C;}
.cred-line-no b{color:#9E2F1C;}
.cred-line-demo > svg{color:#8a6d00;}
.cred-head{font-family:var(--font-head);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 2px;font-weight:800;}
.cred-head:first-of-type{margin-top:2px;}
/* the public "how we check" page */
.vf-steps{display:grid;gap:14px;margin:18px 0 0;}
.vf-step{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;}
.vf-step .n{width:34px;height:34px;flex:none;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:1rem;}
.vf-step b{display:block;font-size:1.02rem;margin-bottom:3px;}
.vf-step p{margin:0;font-size:.93rem;line-height:1.6;color:var(--ink-soft);}
.vf-cond{background:var(--teal-tint);border-radius:16px;padding:18px 20px;margin-top:18px;}
.vf-cond blockquote{margin:10px 0 0;padding-left:14px;border-left:3px solid var(--teal);font-size:.92rem;line-height:1.65;}
.wp-trustbox{background:var(--teal-tint);border-radius:14px;padding:14px 16px;margin-top:14px;font-size:.9rem;line-height:1.55;}
.wp-aside{position:sticky;top:86px;}
@media (max-width:940px){.wp-aside{position:static;}}
.wp-rate b{font-family:var(--font-head);font-size:1.7rem;color:var(--teal);}
.wp-actions{display:flex;flex-direction:column;gap:10px;margin:16px 0 0;}
.wp-mini{display:flex;gap:10px;}
.wp-mini .btn{flex:1;}
.btn-star[aria-pressed="true"]{background:var(--amber-tint);border-color:var(--amber);color:#8a6d00;}
.wp-trust{list-style:none;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px;}
.wp-trust li{display:flex;gap:9px;font-size:.85rem;color:var(--ink-soft);align-items:flex-start;}
.wp-trust svg{width:16px;height:16px;color:var(--ok);flex:none;margin-top:2px;}
.day-toggle{display:flex;gap:8px;flex-wrap:wrap;}
.day-toggle button{font:inherit;font-size:.84rem;font-weight:700;padding:7px 0;width:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);cursor:pointer;color:var(--ink-soft);}
.day-toggle button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;}
.day-toggle button:focus-visible{outline:3px solid var(--amber);outline-offset:1px;}

/* ============ Shift notes ============ */
.note-box{margin-top:10px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--cream);}
.note-box textarea{font:inherit;font-size:.9rem;width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);box-sizing:border-box;background:#fff;}
.note-box textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px;}
.note-out{margin-top:8px;}
.note-entry{margin-top:8px;padding:10px 13px;border-left:3px solid var(--teal);background:#F5F7FA;border-radius:0 10px 10px 0;}
.note-entry.note-flag{border-left-color:#C8462E;background:#FDF6EC;}
.note-entry p{margin:5px 0 0;font-size:.92rem;line-height:1.6;color:var(--ink-soft);}
.note-meta{font-size:.74rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.note-scope-out{margin-top:9px;font-size:.88rem;line-height:1.55;}
.note-locked{font-size:.8rem;color:var(--ink-soft);margin:9px 0 0;}

/* ============ Reviews ============ */
.rate-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.stars{display:inline-flex;gap:1px;}
.star{background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--amber);padding:1px 2px;}
.star:focus-visible{outline:3px solid var(--amber);outline-offset:1px;border-radius:6px;}
.rate-more{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;width:100%;}
.rate-text{font:inherit;font-size:.88rem;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);flex:1;min-width:220px;}
.rev{border-top:1px solid var(--line);padding:12px 0 4px;}
.rev:first-of-type{border-top:none;padding-top:4px;}
.rev-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.rev-top b{font-size:.95rem;}
.rev-stars{color:var(--amber);letter-spacing:2px;font-size:.95rem;}
.rev-top time{color:var(--ink-soft);font-size:.8rem;margin-left:auto;}
.rev p{margin:6px 0 8px;font-size:.95rem;color:var(--ink-soft);line-height:1.6;}

/* ============ SIL rosters ============ */
.sil-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;}
@media (max-width:900px){.sil-grid{grid-template-columns:repeat(2,1fr);}}
.sil-day{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.78rem;min-height:64px;}
.sil-day > b{display:block;color:var(--teal-deep);margin-bottom:2px;}
.sil-slot{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-top:6px;line-height:1.5;}
.sil-slot.sil-unfilled{border-color:var(--coral);background:var(--coral-tint);}

/* ============ Document catalogue: onboarding checklist + typeahead ============ */
.ob-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.ob-bar{flex:1;min-width:140px;height:9px;border-radius:99px;background:var(--cream);border:1px solid var(--line);overflow:hidden;}
.ob-bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s;}
.ob-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;margin:10px 0 6px;}
.ob-item{display:flex;gap:9px;align-items:flex-start;font-size:.84rem;padding:8px 11px;border:1px solid var(--line);border-radius:11px;background:var(--cream);color:var(--ink-soft);}
.ob-item b{color:var(--ink);display:block;font-size:.85rem;}
.ob-item.done{border-color:#DCE6F8;background:var(--teal-tint);}
.ob-item .ob-tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:flex;align-items:center;justify-content:center;background:#fff;}
.ob-item.done .ob-tick{background:var(--teal);border-color:var(--teal);color:#fff;}
.ob-item .ob-tick svg{width:12px;height:12px;}
.ob-item small{display:block;font-size:.76rem;line-height:1.4;}
.doc-group-h{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 2px;}
.typeahead{position:relative;min-width:280px;flex:1;max-width:420px;}
.typeahead input{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);}
.typeahead input:focus-visible{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--teal);}
.ta-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:330px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:80;padding:6px;}
.ta-group{font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);padding:8px 10px 3px;}
.ta-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;font:inherit;font-size:.9rem;font-weight:600;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);}
.ta-item:hover,.ta-item.active{background:var(--teal-tint);color:var(--teal-deep);}
.ta-pts{font-size:.68rem;font-weight:800;color:var(--teal);background:var(--teal-tint);border-radius:999px;padding:2px 8px;flex:none;}
.ta-empty{padding:10px 12px;font-size:.85rem;color:var(--ink-soft);}
.ta-chosen{display:inline-flex;align-items:center;gap:9px;background:var(--teal-tint);color:var(--teal-deep);font-weight:700;font-size:.9rem;padding:7px 13px;border-radius:999px;}
.ta-chosen button{background:none;border:none;cursor:pointer;font:inherit;font-size:.8rem;color:var(--teal);font-weight:800;text-decoration:underline;}
.doc-help{font-size:.8rem;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.check-lines{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:8px;}
.check-lines li{display:flex;gap:10px;align-items:center;font-size:.9rem;}
.check-lines svg{width:18px;height:18px;color:var(--ok);flex:none;}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:14px 26px;border-radius:999px;font-weight:600;font-size:.95rem;
  box-shadow:var(--shadow-lg);opacity:0;transition:all .3s ease;z-index:400;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ Footer ============ */
footer.site{background:var(--ink);color:#D4D9E2;margin-top:0;}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:34px;padding:64px 0 40px;}
@media (max-width:1000px){.foot-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:600px){.foot-grid{grid-template-columns:1fr 1fr;gap:22px;}.foot-brand{grid-column:1/-1;}}
.foot-brand .logo{color:#fff;font-size:1.35rem;margin-bottom:14px;}
.foot-brand p{color:#A9B2C6;font-size:.88rem;max-width:26em;}
footer.site h4{color:#fff;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;font-family:var(--font-head);}
footer.site ul{list-style:none;display:flex;flex-direction:column;gap:10px;}
footer.site ul a{color:#D4D9E2;text-decoration:none;font-size:.92rem;}
footer.site ul a:hover{color:var(--amber);text-decoration:underline;}
footer.site ul a:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
.foot-ack{border-top:1px solid rgba(255,255,255,.14);padding:26px 0;font-size:.83rem;color:#A9B2C6;line-height:1.7;}
.foot-legal{border-top:1px solid rgba(255,255,255,.14);padding:22px 0 30px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:.8rem;color:#A9B2C6;}
.foot-legal a{color:#D4D9E2;}
.ndis-badge{
  display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  border-radius:10px;padding:9px 15px;margin-top:18px;font-size:.82rem;color:#fff;font-weight:600;
}
.ndis-badge svg{width:18px;height:18px;color:var(--amber);}

/* ============ Background decor (site-wide) ============ */
body{overflow-x:clip;}
.has-decor{position:relative;}
.has-decor > .container{position:relative;z-index:1;}
.decor-sprite{position:absolute;pointer-events:none;z-index:0;line-height:0;}
.banner > *{position:relative;z-index:1;}
.decor-figure{position:absolute;bottom:0;pointer-events:none;z-index:0;line-height:0;}
.decor-figure svg{display:block;width:100%;height:auto;}
.fig-clip{overflow:clip;}
/* translucent surfaces site-wide — background graphics ghost through everything */
.service-card,.worker-card,.info-card,.step,.testi,.faq-item,.path-card,.ph-card,.compare-card{background:rgba(255,255,255,.62);}
.form-card,.table-wrap,.filter-bar,.msg-layout,.er-card{background:rgba(255,255,255,.78);}
.hero-search{background:rgba(255,255,255,.85);}
.chip{background:rgba(255,255,255,.7);}
tbody tr:nth-child(even){background:rgba(250,246,240,.55);}
.convo-item:hover{background:rgba(250,246,240,.6);}
.convo-item.active{background:rgba(226,241,238,.75);}
.bubble.them{background:rgba(255,255,255,.85);}
.thread-body{background:rgba(250,246,240,.5);}
.fund-box{background:rgba(253,243,220,.78);}
.er-note{background:rgba(226,241,238,.78);}
.success-box{background:rgba(226,241,238,.78);}
.a11y-group{background:rgba(250,246,240,.7);}
/* high contrast: everything back to solid for maximum legibility */
html.high-contrast .service-card,html.high-contrast .worker-card,html.high-contrast .info-card,
html.high-contrast .step,html.high-contrast .testi,html.high-contrast .faq-item,html.high-contrast .path-card,
html.high-contrast .ph-card,html.high-contrast .compare-card,html.high-contrast .form-card,
html.high-contrast .table-wrap,html.high-contrast .filter-bar,html.high-contrast .msg-layout,
html.high-contrast .er-card,html.high-contrast .hero-search,html.high-contrast .chip,
html.high-contrast .bubble.them,html.high-contrast .fund-box,html.high-contrast .er-note,
html.high-contrast .success-box,html.high-contrast .a11y-group{background:#fff!important;}
html.high-contrast tbody tr:nth-child(even){background:#f0f0f0!important;}
html.high-contrast .decor-figure{display:none;}
@media (max-width:900px){.decor-figure{display:none;}}
.decor-sprite svg{display:block;width:100%;height:auto;}
html.high-contrast .decor-sprite{display:none;}
@media (max-width:680px){.decor-sprite{display:none;}}

/* ============ Interactive illustrations ============ */
.ill-scene{position:relative;cursor:pointer;}
.ill-scene svg{display:block;width:100%;height:auto;border-radius:34px;box-shadow:var(--shadow-lg);}
.ill-scene [data-depth]{transition:transform .25s ease-out;will-change:transform;}
.ill-scene .hov-pop,.ill-scene .hov-spin,.ill-scene .hov-wiggle{transform-box:fill-box;transform-origin:center;transition:transform .35s ease;}
.ill-scene:hover .hov-pop{transform:scale(1.18) rotate(8deg);}
.ill-scene:hover .hov-spin{animation:illspin 9s linear infinite;}
.ill-scene:hover .hov-wiggle{animation:illwig .8s ease-in-out infinite;}
@keyframes illspin{to{transform:rotate(360deg);}}
@keyframes illwig{0%,100%{transform:rotate(-7deg);}50%{transform:rotate(9deg);}}
.ill-scene .p-float{animation:floaty 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
.ill-scene .p-float2{animation:floaty 8s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:center;}
.ill-scene .accent{transform-box:fill-box;transform-origin:center;transition:transform .3s ease;}
.ill-scene.ill-active .accent{animation:illburst .6s ease;}
@keyframes illburst{0%{transform:scale(1);}40%{transform:scale(1.45) rotate(-10deg);}100%{transform:scale(1);}}
html.high-contrast .ill-scene svg{filter:grayscale(35%) contrast(1.15);}
.svc-hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;}
@media (max-width:900px){.svc-hero-grid{grid-template-columns:1fr;}}

/* ============ Easy Read ============ */
.er-wrap{max-width:780px;margin:0 auto;}
.er-h{margin:38px 0 16px;font-size:1.5rem;}
.er-wrap .er-h:first-child{margin-top:0;}
.er-list{display:flex;flex-direction:column;gap:14px;}
.er-card{
  background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;display:flex;gap:20px;align-items:center;box-shadow:var(--shadow);
}
.er-icon{flex:none;width:78px;height:78px;border-radius:18px;display:flex;align-items:center;justify-content:center;}
.er-icon svg{width:42px;height:42px;}
.er-card p{font-size:1.18rem;line-height:1.75;margin:0;color:var(--ink);}
.er-note{
  background:var(--teal-tint);border:2px solid #DCE6F8;border-radius:var(--radius);
  padding:20px 22px;font-size:1.1rem;line-height:1.7;color:var(--ink);
}
html.high-contrast .er-card,html.high-contrast .er-note{border:2px solid #000!important;}
@media (max-width:560px){.er-card{flex-direction:column;text-align:center;align-items:center;}}

/* ============ Messaging ============ */
.msg-btn{position:relative;background:none;border:none;cursor:pointer;padding:9px;border-radius:10px;display:flex;align-items:center;}
.msg-btn:hover{background:var(--teal-tint);}
.msg-btn:focus-visible{outline:3px solid var(--amber);}
.msg-btn svg{width:24px;height:24px;stroke:var(--ink);}
.msg-badge{
  position:absolute;top:2px;right:0;background:var(--coral);color:#fff;border-radius:999px;
  font-size:.68rem;font-weight:700;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;
  padding:0 4px;border:2px solid var(--cream);
}
.msg-layout{
  display:grid;grid-template-columns:340px 1fr;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;height:660px;
}
.convo-list{border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;}
.convo-list-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.convo-list-head h2{font-size:1.15rem;margin:0;}
.convo-item{
  display:flex;gap:12px;padding:15px 18px;cursor:pointer;border:none;border-bottom:1px solid var(--line);
  background:none;text-align:left;width:100%;font-family:var(--font-body);align-items:center;
}
.convo-item:hover{background:var(--cream);}
.convo-item.active{background:var(--teal-tint);}
.convo-item:focus-visible{outline:3px solid var(--amber);outline-offset:-3px;}
.convo-item .wc-avatar{width:46px;height:46px;font-size:1rem;}
.ci-main{flex:1;min-width:0;}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.ci-top b{font-size:.95rem;}
.ci-top time{font-size:.72rem;color:var(--ink-soft);white-space:nowrap;}
.ci-preview{font-size:.83rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.ci-unread .ci-preview{color:var(--ink);font-weight:600;}
.ci-dot{width:10px;height:10px;border-radius:50%;background:var(--coral);flex:none;}
.thread{display:flex;flex-direction:column;min-width:0;}
.thread-head{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;}
.thread-head .wc-avatar{width:44px;height:44px;font-size:.95rem;}
.thread-head b{display:block;font-size:1rem;}
.thread-head small{color:var(--ink-soft);font-size:.78rem;}
.thread-head .btn{margin-left:auto;}
.thread-back{display:none;background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;}
.thread-back svg{width:22px;height:22px;stroke:var(--ink);}
.thread-safety{
  background:var(--amber-tint);border-bottom:1px solid #eeda9f;padding:8px 20px;font-size:.78rem;color:var(--ink-soft);
  display:flex;gap:8px;align-items:center;
}
.thread-safety svg{width:15px;height:15px;flex:none;color:#8a6d00;}
.thread-body{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:10px;background:var(--cream);}
html.high-contrast .thread-body{background:#f4f4f4;}
.bubble{max-width:74%;padding:10px 16px;border-radius:16px;font-size:.94rem;line-height:1.5;}
.bubble.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:5px;}
.bubble.them{align-self:flex-start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:5px;}
.bubble time{display:block;font-size:.68rem;opacity:.7;margin-top:4px;}
.day-divider{align-self:center;font-size:.72rem;font-weight:700;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:3px 13px;border-radius:999px;margin:6px 0;}
.typing{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;padding:14px 18px;display:flex;gap:5px;}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;}
.typing i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
.composer{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-end;}
.composer textarea{
  flex:1;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:11px 15px;font-family:var(--font-body);
  font-size:.95rem;color:var(--ink);max-height:110px;background:#fff;
}
.composer textarea:focus-visible{outline:3px solid var(--amber);border-color:var(--teal);}
.composer .send{
  background:var(--teal);border:none;color:#fff;width:46px;height:46px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.composer .send:hover{background:var(--teal-deep);}
.composer .send:focus-visible{outline:3px solid var(--amber);}
.composer .send svg{width:21px;height:21px;}
.composer-note{font-size:.72rem;color:var(--ink-soft);text-align:center;padding:0 16px 12px;}
.thread-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-soft);padding:30px;text-align:center;}
.thread-empty svg{width:54px;height:54px;color:var(--teal);opacity:.5;}
@media (max-width:880px){
  .msg-layout{grid-template-columns:1fr;height:calc(100vh - 190px);min-height:480px;}
  .msg-layout .thread{display:none;}
  .msg-layout .convo-list{border-right:none;}
  .msg-layout.show-thread .thread{display:flex;}
  .msg-layout.show-thread .convo-list{display:none;}
  .thread-back{display:block;}
}

/* ============ Router pages ============ */
.page{display:none;}
.page.active{display:block;}
main:focus{outline:none;}

/* utility */
.mt-1{margin-top:10px;} .mt-2{margin-top:20px;} .mt-3{margin-top:32px;} .mt-4{margin-top:48px;}
.mb-2{margin-bottom:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:800px){.grid-2{grid-template-columns:1fr;}}
.muted-sm{font-size:.85rem;color:var(--ink-soft);}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

/* bookings */
.bk-list{display:flex;flex-direction:column;gap:16px;max-width:880px;}
.bk-card{display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;flex-wrap:wrap;}
.bk-card .wc-avatar{width:48px;height:48px;font-size:1rem;flex:none;}
.bk-main{display:flex;flex-direction:column;gap:3px;flex:1;min-width:220px;}
.bk-status{font-weight:700;font-size:.8rem;padding:5px 14px;border-radius:999px;white-space:nowrap;}
.bk-requested{background:var(--amber-tint);color:#8a6d00;}
.bk-accepted{background:#E1F3E7;color:var(--ok);}
.bk-declined{background:var(--coral-tint);color:var(--coral);}
.bk-cancelled{background:#eee;color:var(--ink-soft);}
.bk-completed{background:#DCE6F8;color:#203566;}
.bk-actions{display:flex;gap:8px;flex-wrap:wrap;}
html.high-contrast .bk-card{background:#fff!important;border:2px solid #000!important;}

/* ═══════════════════════════════════════════════════════════════
   2026 GRAPHICS OVERHAUL — "two circles, one story"
   A cascade layer appended after the base system: richer tokens,
   Fraunces display type, the interlinked-oo brand mark everywhere,
   mesh-gradient surfaces, film grain, scroll reveals, kinetic type.
   Light theme only. Every effect dies under reduced motion & high
   contrast. Base classes untouched — overrides only.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --pine:#15264D;
  --pine-deep:#101C3B;
  --spark:#4A66A8;
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 1px 2px rgba(23,31,56,.05), 0 10px 28px -6px rgba(23,31,56,.10);
  --shadow-lg:0 2px 4px rgba(23,31,56,.05), 0 24px 60px -12px rgba(23,31,56,.18);
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
html[data-font="readable"]{--font-display:Verdana,'Trebuchet MS',Tahoma,sans-serif;}
#page-easy-read h1,#page-easy-read h2,#page-easy-read h3{font-family:var(--font-head);}
html[data-font="readable"] .rotator{width:auto!important;}
html[data-motion="reduce"] .rotator{width:auto!important;}
@media (prefers-reduced-motion:reduce){.rotator{width:auto!important;}}
::selection{background:var(--amber);color:var(--ink);}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (min-width:701px){
  body::after{
    content:"";position:fixed;inset:-40px;z-index:3000;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;
  }
}
html.high-contrast body::after{display:none;}
@media (min-width:1100px){
  ::-webkit-scrollbar{width:13px;}
  ::-webkit-scrollbar-track{background:var(--cream);}
  ::-webkit-scrollbar-thumb{background:#CBBFAE;border-radius:99px;border:3.5px solid var(--cream);}
  ::-webkit-scrollbar-thumb:hover{background:var(--teal);}
}

/* ---------- display typography ---------- */
.hero h1,.page-hero h1,.section-head h2,.split h2,.banner h2{
  font-family:var(--font-display);font-optical-sizing:auto;font-weight:560;
  letter-spacing:-.018em;
}
#page-home h2,#page-how-it-works h2,#page-pricing h2,#page-services h2,#page-services-employment h2,#page-services-personal-care h2,#page-services-transport h2,#page-services-daily-tasks h2,#page-services-household h2,#page-services-community h2,#page-about h2,#page-safety h2,#page-faq h2,#page-find-workers h2,#page-support-workers h2,#page-for-families h2,#page-for-plan-managers h2,#page-locations h2,#page-specialist-supports h2,#page-contact h2,#page-legal h2,#page-get-started h2,#page-easy-read h2,#page-calculator h2{
  font-family:var(--font-display);font-optical-sizing:auto;font-weight:560;letter-spacing:-.016em;
}
.hero h1 em,.page-hero h1 em,.section-head h2 em,.split h2 em,.banner h2 em,.fh-line em{
  font-style:italic;font-weight:520;color:var(--teal);
}
.hero h1{font-size:clamp(2.3rem,5vw,3.85rem);line-height:1.07;}
@media (min-width:901px){.hero-grid{grid-template-columns:1.14fr .86fr;}}
.hero-grid > *{min-width:0;}
.nav-cta .btn{white-space:nowrap;}
/* the base sheet hides the ghost Log in under 1020px — bring it back;
   under 480px Get started cedes the space (it lives in the burger menu too) */
@media (max-width:1020px){
  .nav-cta .btn-ghost{display:inline-flex;}
}
@media (max-width:480px){
  #btnGetStarted{display:none;}
  .nav-cta{gap:6px;}
  .nav-cta .btn-ghost{padding:8px 12px;font-size:.95rem;}
}
.section-head h2,.split h2{font-size:clamp(1.85rem,3.4vw,2.7rem);line-height:1.12;}
.page-hero h1{font-size:clamp(2.2rem,4vw,3.15rem);line-height:1.08;}
.section-head p.lead{font-size:1.08rem;}
.kicker{
  background:transparent;border:1.5px solid rgba(32,53,102,.28);
  letter-spacing:.14em;padding:6px 16px 6px 13px;
  display:inline-flex;align-items:center;gap:8px;
}
.kicker::before{
  content:"";width:15px;height:7px;flex:none;border-radius:99px;
  background:
    radial-gradient(circle at 26% 50%, var(--teal) 0 42%, transparent 46%),
    radial-gradient(circle at 74% 50%, var(--amber) 0 42%, transparent 46%);
}
html.high-contrast .kicker{border-color:#000;}

/* ---------- the oo wordmark ---------- */
.logo{font-size:1.68rem;letter-spacing:-.04em;gap:2px;transition:transform .3s var(--ease-spring);}
.logo:hover{transform:translateY(-1px);}
.logo svg.oo{height:.7em;margin:.13em 2px 0;overflow:visible;}
.logo svg.oo .o1,.logo svg.oo .o2,.logo svg.oo .lens{
  transform-box:fill-box;transform-origin:center;
  transition:transform .38s var(--ease-spring);
}
.logo:hover svg.oo .o1{transform:translateX(5px) scale(1.04);}
.logo:hover svg.oo .o2{transform:translateX(-5px) scale(1.04);}
.logo:hover svg.oo .lens{transform:scaleX(1.55);}
html.js-fx .logo svg.oo .o1{animation:ooRollL .9s var(--ease-out) both;}
html.js-fx .logo svg.oo .o2{animation:ooRollR .9s var(--ease-out) both;}
html.js-fx .logo svg.oo .lens{animation:ooLens .5s .55s var(--ease-out) both;}
html.js-fx .logo svg.oo .tick{stroke-dasharray:40;stroke-dashoffset:40;animation:ooTick .45s .75s var(--ease-out) forwards;}
@keyframes ooRollL{0%{transform:translateX(-26px) rotate(-120deg);opacity:0;}45%{opacity:1;}100%{transform:none;opacity:1;}}
@keyframes ooRollR{0%{transform:translateX(26px) rotate(120deg);opacity:0;}45%{opacity:1;}100%{transform:none;opacity:1;}}
@keyframes ooLens{0%{transform:scaleX(.1);opacity:0;}100%{transform:none;opacity:1;}}
@keyframes ooTick{to{stroke-dashoffset:0;}}

/* ---------- header ---------- */
header.site{border-bottom-color:transparent;transition:box-shadow .35s ease, background .35s ease, border-color .35s ease;}
header.site.scrolled{
  background:rgba(250,246,240,.8);backdrop-filter:blur(16px) saturate(1.35);
  border-bottom-color:var(--line);box-shadow:0 10px 40px -12px rgba(23,31,56,.14);
}
@media (max-width:1020px){header.site.scrolled{background:var(--cream);}}
nav.main a.nav-link,nav.main button.nav-link{position:relative;transition:background .2s ease,color .2s ease;}
nav.main a.nav-link[aria-current="page"]{background:transparent;}
nav.main a.nav-link[aria-current="page"]::after{
  content:"";position:absolute;left:14px;bottom:2px;width:16px;height:7px;border-radius:99px;
  background:
    radial-gradient(circle at 27% 50%, var(--teal) 0 44%, transparent 48%),
    radial-gradient(circle at 73% 50%, var(--amber) 0 44%, transparent 48%);
}
.dropdown-menu{border-radius:18px;box-shadow:var(--shadow-lg);border-color:rgba(226,224,218,.8);}
html.js-fx .dropdown.open .dropdown-menu{animation:ddIn .28s var(--ease-out);}
@keyframes ddIn{from{opacity:0;transform:translateY(-7px) scale(.985);}to{opacity:1;transform:none;}}

/* ---------- buttons ---------- */
.btn{
  position:relative;overflow:hidden;font-weight:700;
  transition:transform .22s var(--ease-spring), box-shadow .25s ease, background .2s ease, border-color .2s ease, color .2s ease;
}
.btn-primary{background:linear-gradient(135deg,var(--spark) -30%,var(--teal) 42%,var(--teal-deep) 115%);}
.btn-primary::before,.btn-coral::before{
  content:"";position:absolute;top:0;bottom:0;left:-72%;width:46%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.32),transparent);
  transform:skewX(-18deg);transition:left .55s ease;
}
.btn-primary:hover,.btn-coral:hover{transform:translate(var(--mx,0),var(--my,0)) translateY(-2px);box-shadow:0 14px 34px -10px rgba(21,38,77,.45);}
.btn-primary:hover::before,.btn-coral:hover::before{left:130%;}
.btn-primary:active,.btn-coral:active{transform:scale(.97);}
.btn-secondary:hover{transform:translateY(-2px);box-shadow:0 10px 26px -12px rgba(21,38,77,.3);}
html[data-motion="reduce"] .btn-primary::before,html[data-motion="reduce"] .btn-coral::before{display:none;}
html.high-contrast .btn-primary{background:#000;}

/* ---------- hero ---------- */
.hero{
  padding:92px 0 84px;position:relative;
  background:
    radial-gradient(1100px 520px at 86% -12%, rgba(241,190,72,.26), transparent 62%),
    radial-gradient(760px 500px at -6% 108%, rgba(32,53,102,.16), transparent 62%),
    radial-gradient(620px 420px at 55% 118%, rgba(200,70,46,.07), transparent 60%),
    linear-gradient(180deg,#FDFBF7, var(--cream));
}
.hero > .container{position:relative;z-index:1;}
.hero-rings{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.hero-rings i{position:absolute;border-radius:50%;border:2.5px solid rgba(32,53,102,.13);}
.hero-rings i:nth-child(1){width:560px;height:560px;right:-140px;top:-190px;border-color:rgba(241,190,72,.35);border-width:3px;}
.hero-rings i:nth-child(2){width:560px;height:560px;right:150px;top:-260px;}
.hero-rings i:nth-child(3){width:230px;height:230px;left:-90px;bottom:-70px;border-color:rgba(200,70,46,.14);}
html.js-fx .hero-rings i:nth-child(1){animation:ringDrift 17s ease-in-out infinite;}
html.js-fx .hero-rings i:nth-child(2){animation:ringDrift 23s ease-in-out infinite reverse;}
html.js-fx .hero-rings i:nth-child(3){animation:ringDrift 19s 2s ease-in-out infinite;}
@keyframes ringDrift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(-26px,18px) scale(1.045);}66%{transform:translate(20px,-14px) scale(.97);}}
html.high-contrast .hero-rings{display:none;}
html.high-contrast .hero h1 .u::after{display:none;}
.hero .kicker{background:rgba(255,255,255,.55);}
.hero h1 .u::after{
  height:.4em;bottom:.03em;left:-.06em;right:-.06em;border-radius:.18em .22em .16em .24em;
  background:linear-gradient(92deg,var(--amber) 4%,#FFD87A 96%);opacity:.6;transform:rotate(-.7deg);
}
html.js-fx .hero h1 .u::after{transform-origin:left center;animation:markerIn .7s .5s var(--ease-out) both;}
@keyframes markerIn{from{transform:scaleX(0) rotate(-.7deg);}to{transform:scaleX(1) rotate(-.7deg);}}
.rotator{display:inline-block;position:relative;overflow:hidden;vertical-align:bottom;white-space:nowrap;transition:width .38s var(--ease-out);}
.rotator .rot-word{display:inline-block;white-space:nowrap;}
.rotator .rot-out{position:absolute;left:0;top:0;animation:rotOut .5s var(--ease-out) forwards;}
.rotator .rot-in{animation:rotIn .5s var(--ease-out);}
@keyframes rotOut{to{transform:translateY(-112%);opacity:.2;}}
@keyframes rotIn{from{transform:translateY(112%);opacity:.2;}to{transform:none;opacity:1;}}
.hero .lead{font-size:1.16rem;margin:22px 0 30px;}
.hero-search{padding:9px 9px 9px 24px;max-width:500px;border-width:2px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);}
.hero-search:focus-within{box-shadow:0 0 0 4px rgba(32,53,102,.14), var(--shadow-lg);transform:scale(1.012);}
.hero-search{transition:box-shadow .25s ease, transform .25s ease, border-color .2s ease;}
.trust-chips .chip{backdrop-filter:blur(5px);transition:transform .25s var(--ease-spring), border-color .2s ease;}
.trust-chips .chip:hover{transform:translateY(-2px) rotate(-.5deg);border-color:var(--teal);}
.float-card{
  background:rgba(255,255,255,.82);backdrop-filter:blur(10px) saturate(1.2);
  border:1px solid rgba(255,255,255,.85);border-radius:18px;
  box-shadow:0 3px 8px rgba(23,31,56,.06), 0 26px 60px -14px rgba(23,31,56,.26);
}
html.js-fx .fc1{animation:floaty 5s ease-in-out infinite, fcIn .8s .35s var(--ease-spring) backwards;}
html.js-fx .fc2{animation:floaty 6s ease-in-out infinite reverse, fcIn .8s .6s var(--ease-spring) backwards;}
@keyframes fcIn{from{opacity:0;transform:translateY(26px) scale(.9);}to{opacity:1;transform:none;}}

/* ---------- marquee ---------- */
.oo-marquee{
  background:var(--pine);color:#EEF0F3;overflow:hidden;white-space:nowrap;
  padding:15px 0;border-block:1px solid rgba(255,255,255,.08);position:relative;
}
.oo-marquee::before,.oo-marquee::after{
  content:"";position:absolute;top:0;bottom:0;width:90px;z-index:1;pointer-events:none;
}
.oo-marquee::before{left:0;background:linear-gradient(90deg,var(--pine),transparent);}
.oo-marquee::after{right:0;background:linear-gradient(-90deg,var(--pine),transparent);}
.mq-track{display:inline-flex;align-items:center;gap:34px;padding-right:34px;will-change:transform;}
html.js-fx .mq-track{animation:mqScroll 36s linear infinite;}
.oo-marquee:hover .mq-track{animation-play-state:paused;}
@keyframes mqScroll{to{transform:translateX(-50%);}}
.mq-track span{font-family:var(--font-head);font-weight:600;font-size:.95rem;letter-spacing:.01em;display:inline-flex;align-items:center;gap:10px;}
.mq-track span i{font-style:normal;font-family:var(--font-body);font-weight:700;font-size:.72rem;letter-spacing:.09em;color:var(--pine-deep);background:var(--amber);border-radius:99px;padding:2.5px 9px;}
.mq-oo{width:26px;height:13px;flex:none;border-radius:99px;
  background:
    radial-gradient(circle at 31% 50%, rgba(74,102,168,.95) 0 38%, transparent 43%),
    radial-gradient(circle at 69% 50%, rgba(241,190,72,.95) 0 38%, transparent 43%);
}
html.high-contrast .oo-marquee{display:none;}

/* ---------- value strip ---------- */
.value-strip{
  background:
    radial-gradient(720px 300px at 88% -30%, rgba(241,190,72,.15), transparent 60%),
    radial-gradient(560px 320px at 4% 130%, rgba(74,102,168,.35), transparent 62%),
    linear-gradient(135deg,var(--pine) 0%,var(--pine-deep) 100%);
}
.value-strip .container{padding-top:46px;padding-bottom:46px;row-gap:34px;}
.strip-heads{
  grid-column:1/-1;display:flex;justify-content:center;gap:clamp(26px,6vw,90px);flex-wrap:wrap;
  padding-bottom:34px;border-bottom:1px solid rgba(255,255,255,.14);
}
.strip-heads .sh{text-align:center;}
.strip-heads .sh b{
  display:block;font-family:var(--font-display);font-style:italic;font-weight:480;
  font-size:clamp(2rem,4vw,3rem);line-height:1.1;color:#fff;
}
.strip-heads .sh:nth-child(1) b{color:#FFD87A;}
.strip-heads .sh:nth-child(2) b{color:#BCD3F5;}
.strip-heads .sh:nth-child(3) b{color:#F1BE48;}
.strip-heads .sh span{font-size:.86rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.66);}
.value-item svg{

.value-item:hover svg{transform:rotate(-6deg) scale(1.1);background:rgba(255,255,255,.16);}
@media (max-width:640px){.value-item{flex-direction:column;gap:10px;}}
html.high-contrast .value-strip{background:#000;}

/* ---------- services bento (home only) ---------- */
.service-card{border-radius:26px;transition:transform .3s var(--ease-out), box-shadow .3s ease, border-color .25s ease;}
.service-card:hover{border-color:rgba(32,53,102,.35);}
.service-card .go{transition:gap .25s var(--ease-spring), color .2s ease;}
.service-card:hover .go{gap:12px;color:var(--teal-deep);}
.service-icon{transition:transform .35s var(--ease-spring);border-radius:18px;}
.service-card:hover .service-icon{transform:rotate(-7deg) scale(1.12);}
#homeServices .service-card{position:relative;overflow:hidden;}
#homeServices .service-card::after{
