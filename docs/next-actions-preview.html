tent:space-between;margin:0;padding:7px 0;font-size:.84rem}.na-subitems strong{display:block;font-weight:600}.na-subitems p{margin:3px 0;color:var(--ink-soft,#4c5e70);font-size:.82rem;white-space:pre-wrap;overflow-wrap:anywhere}.na-subitems a{font-size:.82rem;padding:3px;flex-shrink:0}.na-more{border-bottom:1px solid var(--line,#d8dee5);margin:5px 0 0}.na-more>summary{font-size:.88rem;padding:14px 0;cursor:pointer;font-weight:600}.na-waiting{margin-top:24px;border:1px solid var(--line,#d8dee5);border-radius:8px;padding:0 14px;background:var(--card,#fff)}.na-waiting>summary{padding:13px 0;cursor:pointer;font-size:.95rem;font-weight:600}.na-count{font-size:.8rem;font-weight:400;margin-left:10px;color:var(--ink-soft,#4c5e70)}.na-muted,.na-foot{font-size:.84rem;color:var(--ink-soft,#4c5e70)}.na-wait-list{list-style:none;margin:0;padding:0}.na-wait-list>li{display:flex;gap:18px;justify-content:space-between;align-items:start;padding:12px 0;border-top:1px solid var(--line,#d8dee5)}.na-wait-list h3{font-size:.95rem;margin:0}.na-wait-list p{font-size:.84rem;margin:4px 0}.na-wait-list>li>a{font-size:.84rem;flex-shrink:0;padding:3px}.na-next-visit{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:20px 0 0;border-top:1px solid var(--line,#d8dee5);padding:16px 0}.na-next-visit p{font-size:.92rem;margin:4px 0}.na-next-visit>a{font-size:.85rem;flex-shrink:0}.na-foot{margin:20px 0 0}.na-clear{display:flex;align-items:center;gap:12px;padding:14px 0;color:var(--teal-deep,#246841)}.na-clear>span{font-size:1.35rem}.na-clear p{font-size:.95rem}.na-cover{border-left:3px solid #b23c28;padding:10px 14px;background:var(--card,#fff);margin-top:18px;font-size:.9rem}.na-cover p{margin:6px 0}#naStatus:empty{display:none}#naStatus{font-size:.9rem;padding:10px 0}.na-workspace :is(a,button,summary):focus-visible,.na-tools summary:focus-visible{outline:3px solid #bd6e17;outline-offset:3px}.na-workspace :is(h3,p,a){overflow-wrap:anywhere}\n.na-office-bar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:0 0 16px}.na-office-bar .flow-form{display:flex;align-items:end;gap:8px;max-width:100%;flex-wrap:wrap}.na-office-bar .flow-form label{min-width:min(220px,100%)}.na-office-bar .flow-form [data-flow-status]:empty{display:none}.na-office-list{border-top:1px solid var(--line,#d8dee5)}.na-office-row{padding:14px 0;border-bottom:1px solid var(--line,#d8dee5)}.na-office-line{display:flex;align-items:center;justify-content:space-between;gap:16px}.na-office-line h3{font-size:1rem;margin:0}.na-office-line p{font-size:.85rem;margin:4px 0}.na-office-row details{margin-top:8px}.na-office-row summary{cursor:pointer;font-size:.84rem}.na-office-row .flow-form{margin:10px 0;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.na-office-row .flow-form [data-flow-status]:empty{display:none}.na-office-row .flow-form label{max-width:100%;font-size:.85rem}.na-office-row .flow-form input,.na-office-row .flow-form select{padding:7px}.na-office-meta{font-size:.85rem;color:var(--ink-soft,#4c5e70)}\n@media(max-width:650px){.na-intro{flex-wrap:wrap;gap:8px}.na-task,.na-task.na-first{grid-template-columns:24px minmax(0,1fr);gap:10px;padding:15px 10px}.na-task-go{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}.na-start{order:2}.na-task-title h3{font-size:1rem}.na-next-visit,.na-wait-list>li{flex-wrap:wrap;gap:8px}.na-office-line{align-items:start;flex-wrap:wrap}.na-action{min-height:40px}}\n@media(pointer:coarse){.na-workspace :is(button,.na-action),.na-tools summary,.na-more>summary,.na-waiting>summary{min-height:44px}.na-subitems a,.na-details summary,.na-wait-list>li>a,.na-next-visit>a{min-height:36px;display:inline-flex;align-items:center}}\nhtml.high-contrast :is(.na-tag,.na-number,.na-muted,.na-start,.na-count,.na-foot){color:inherit}.na-primary:disabled,.na-refresh:disabled{opacity:.6;cursor:wait}\n\n.na-office-line>div{min-width:0;flex:1}.na-office-line :is(h3,p){overflow-wrap:anywhere}.na-office-line>.na-action{flex-shrink:0}\n<\/style><\/head><body><div class=\"preview-brand\">The Care Web<span>Next actions preview<\/span><\/div><div id=\"previewNote\" class=\"preview-note\" role=\"status\"><\/div><main id=\"page-journey\"><div class=\"flow-head\"><h1>Next actions<\/h1><a href=\"#/account\">Settings<\/a><\/div><nav id=\"flowTabs\" class=\"flow-tabs\"><details class=\"na-tools\"><summary>More tools<\/summary><div class=\"na-tool-links\"><a href=\"#/journey?panel=recruitment\">Application<\/a><a href=\"#/journey?panel=payroll\">Pay status<\/a><a href=\"#/journey?panel=renewals\">Upcoming renewals<\/a><\/div><\/details><\/nav><div id=\"content\"><\/div><\/main><script>const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));const fmtAU=x=>new Date(x+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});'use strict';\n/* Presentation groups do not complete, dismiss or reassign the underlying tasks. */\nwindow.CareNextActions = (() => {\n  const e = value => esc(String(value ?? ''));\n  const safe = href => /^#\\/(?!\\/)/.test(String(href || '')) ? href : '#/contact';\n  const suffix = task => String(task.task_key || '').replace(/^\\d+:/,'');\n  const dateOnly = value => /^\\d{4}-\\d{2}-\\d{2}/.exec(String(value || ''))?.[0] || '';\n  const dateLabel = value => dateOnly(value) ? fmtAU(dateOnly(value)) : '';\n  const dayNumber = value => Date.parse(dateOnly(value)+'T00:00:00Z') / 864e5;\n  function timing(task, today, now) {\n    const due=dateOnly(task.due_at);if(!due)return {rank:9,label:'',className:'',stamp:Infinity};\n    const delta=dayNumber(due)-dayNumber(today),stamp=Date.parse(task.due_at);\n    // Visit deadlines are times; document due dates are calendar days.\n    const timed=['booking','cover'].includes(task.kind);\n    if(delta<0 || (timed && Number.isFinite(stamp) && stamp<now))return {rank:0,label:'Overdue',className:'na-overdue',stamp};\n    if(delta===0)return {rank:1,label:'Due today',className:'na-due',stamp};\n    if(delta<=7)return {rank:2,label:'Due '+dateLabel(due),className:'na-due',stamp};\n    return {rank:8,label:'Due '+dateLabel(due),className:'',stamp};\n  }\n  function action(task, role, destination) {\n    const href=safe(destination(task)),key=suffix(task),worker=role==='worker';\n    if(worker && href.startsWith('#/account/credentials'))return {group:'credentials',title:'Complete your document checklist',hint:'Add or replace the files listed in Credentials & checks.',verb:'Open checklist',href};\n    if(worker && href.startsWith('#/account/training'))return {group:'training',title:'Complete your training',hint:'Finish the modules that are outstanding or due for renewal.',verb:'Open training',href};\n    if(href==='#/support-plan')return {group:'support-plan',title:'Review your support plan',hint:'Complete the sections that still need your attention.',verb:'Open support plan',href};\n    if(href==='#/account/billing'||href==='#/journey?panel=billing')return {group:'funding',title:'Confirm your funding details',hint:'Check how your support will be paid for.',verb:'Review funding',href};\n    if(role==='coordinator'&&href==='#/clients')return {group:'client-documents',title:'Review their documents',hint:'Open the selected person\u2019s file to review the requested documents.',verb:'Open client file',href};\n    if(href==='#/account/documents')return {group:'documents',title:'Complete your document checklist',hint:'Review the missing, requested or expiring items on your file.',verb:'Open checklist',href};\n    if(key.includes('verify-email'))return {group:'email',title:role==='coordinator'?'Confirm their email address':'Confirm your email address',hint:role==='coordinator'?'Ask the person to use the verification link in their email.':'Use the verification link in your email. You can request another copy.',verb:role==='coordinator'?'Open client file':'Resend email',href:role==='coordinator'?'#/clients':href,email:role!=='coordinator'};\n    if(href==='#/account/profile')return {group:'profile',title:'Complete your profile',hint:'Update the details needed for your account.',verb:'Open profile',href};\n    const verb={booking:'Review request',shift:'Write shift note',review:worker?'Answer question':'Review timesheet',followup:'Share feedback',renewal:'Renew document',document:'Open document',setup:href.startsWith('#/form/')?'Review form':'Open details'}[task.kind] || 'Open task';\n    return {group:href,title:task.label || 'Review this task',hint:task.detail || '',verb,href};\n  }\n  function waitingAction(task, role) {\n    const key=suffix(task),worker=role==='worker',destination=String(task.destination || '');\n    if(task.kind==='cover')return {group:'cover:'+key,title:task.label,href:safe(destination),verb:'View visit'};\n    if(task.kind==='recruitment'||/setup:activation/.test(key))return {group:'application',title:'Application review',href:'#/journey?panel=recruitment',verb:'View application'};\n    if(task.kind==='document'||/setup:(verify-|screening-status|register-)/.test(key))return {group:'documents',title:'Document and screening checks',href:worker?'#/account/credentials':role==='coordinator'?'#/clients':'#/account/documents',verb:'View documents'};\n    if(task.kind==='transition')return {group:'transition:'+destination,title:'Support changes',href:safe(destination),verb:'View request'};\n    // Never send a person into an office-only route or back into this same list.\n    const href=destination.startsWith('#/admin')||/^#\\/journey(?:\\?panel=tasks)?$/.test(destination)?'#/contact':safe(destination);\n    return {group:href,title:task.label || 'Office review',href,verb:href==='#/contact'?'Contact the office':'View record'};\n  }\n  function build(data,destination) {\n    const now=Date.parse(data.as_of || '') || Date.now(),today=data.today || new Date(now).toISOString().slice(0,10);\n    const groups={person:new Map(),office:new Map()},seen=new Set();\n    for(const t of data.tasks || []){\n      if(t.state==='completed' || seen.has(t.task_key))continue;seen.add(t.task_key);\n      const owner=t.owner_kind==='person'?'person':'office';\n      const meta=owner==='person'?action(t,data.role,destination):waitingAction(t,data.role);\n      let group=groups[owner].get(meta.group);\n      if(!group){group={...meta,owner,tasks:[],items:new Map(),rank:9,stamp:Infinity};groups[owner].set(meta.group,group);}\n      const time=timing(t,today,now);\n      const workRank=meta.group==='email'?2:meta.group==='profile'?3:({review:2,shift:2,booking:3,setup:4,document:4,followup:5,renewal:6}[t.kind] ?? 6);\n      const rank=Math.min(time.rank,workRank);\n      group.tasks.push(t);\n      if(rank<group.rank || (rank===group.rank&&time.stamp<group.stamp)){group.rank=rank;group.stamp=time.stamp;group.time=time;group.first=t;if(owner==='person')group.href=meta.href;}\n      const href=owner==='person'?meta.href:group.href;\n      const type=/[?&]type=([^&]+)/.exec(href)?.[1];\n      const itemLabel=owner==='office'&&group.group==='documents'?String(t.label||'').replace(/^(?:Office review: |Review received |Office check: )/,''):String(t.label||'');\n      const itemKey=owner==='person'&&type?'type:'+type:href+'|'+itemLabel;\n      let item=group.items.get(itemKey);\n      if(!item){item={task:t,href,label:itemLabel || 'Review item',notes:new Set(),time};group.items.set(itemKey,item);}\n      if(time.rank<item.time.rank){item.task=t;item.label=itemLabel;item.time=time;}\n      if(t.detail)item.notes.add(t.detail);\n    }\n    const sort=list=>[...list.values()].sort((a,b)=>a.rank-b.rank||a.stamp-b.stamp||String(a.first?.task_key||a.group).localeCompare(String(b.first?.task_key||b.group)));\n    return {mine:sort(groups.person),office:sort(groups.office),today,now};\n  }\n  const dueTag = time => time?.label?`<span class=\"na-tag ${time.className}\">${e(time.label)}<\/span>`:'';\n  function subitems(group) {\n    const items=[...group.items.values()].sort((a,b)=>a.time.rank-b.time.rank||a.time.stamp-b.time.stamp);\n    if(items.length===1 && items[0].label===group.title && (!items[0].notes.size || [...items[0].notes].join(' ')===group.hint))return '';\n    return `<details class=\"na-details\"><summary>${items.length===1?'Details':items.length+' items to check'}<\/summary><ul class=\"na-subitems\">${items.map(item=>`<li><div><strong>${e(item.label)}<\/strong>${dueTag(item.time)}${[...item.notes].map(n=>`<p>${e(n)}<\/p>`).join('')}<\/div>${group.owner==='person'&&!group.email?`<a href=\"${e(item.href)}\" data-flow-task=\"${e(item.task.task_key)}\" aria-label=\"Open ${e(item.label)}\">Open<\/a>`:''}<\/li>`).join('')}<\/ul><\/details>`;\n  }\n  function taskRow(group,index){\n    return `<li class=\"na-task${index===0?' na-first':''}\"><span class=\"na-number\" aria-hidden=\"true\">${index+1}<\/span><div class=\"na-task-body\"><div class=\"na-task-title\"><h3>${e(group.title)}<\/h3>${dueTag(group.time)}<\/div>${group.hint?`<p>${e(group.hint)}<\/p>`:''}${subitems(group)}<\/div><div class=\"na-task-go\">${index===0?'<span class=\"na-start\">Start here<\/span>':''}${group.email?`<button type=\"button\" class=\"na-action${index===0?' na-primary':''}\" data-flow-action=\"resend-email\" data-flow-task=\"${e(group.first.task_key)}\">Resend email<\/button>`:`<a class=\"na-action${index===0?' na-primary':''}\" href=\"${e(group.href)}\" data-flow-task=\"${e(group.first.task_key)}\">${e(group.verb)}<\/a>`}<\/div><\/li>`;\n  }\n  function render(data,destination=t=>t.destination) {\n    const model=build(data,destination),{mine,office}=model;\n    // Keep every overdue/today group visible, even when there are more than three.\n    const visible=Math.max(3,mine.filter(g=>g.time?.rank<=1).length);\n    const heading=mine.length?mine.length+' action'+(mine.length===1?'':'s')+' need'+(mine.length===1?'s':'')+' your attention':office.length?'Nothing you need to do right now':'You are up to date';\n    const hint=mine.length?'Start with the first item. Related steps are grouped together.':office.length?'Your outstanding reviews are with the office.':'New requests and anything due will appear here.';\n    const activeBookings=new Set(mine.flatMap(g=>g.tasks).map(t=>/[?&]booking=(\\d+)/.exec(String(t.destination))?.[1]).filter(Boolean));\n    const next=(data.next || []).find(v=>!activeBookings.has(String(v.id)) && (!v.ends_at||Date.parse(v.ends_at)>model.now));\n    const urgentOffice=office.filter(g=>g.time?.rank<=1&&g.tasks.some(t=>t.kind==='cover'));\n    return `<div class=\"na-workspace\"><div class=\"na-intro\"><div><h2>${e(heading)}<\/h2><p>${e(hint)}<\/p><\/div><button type=\"button\" class=\"na-refresh\" data-flow-action=\"refresh\">Refresh list<\/button><\/div><p id=\"naStatus\" role=\"status\" aria-live=\"polite\"><\/p>\n      ${mine.length?`<ol class=\"na-list\">${mine.slice(0,visible).map(taskRow).join('')}<\/ol>${mine.length>visible?`<details class=\"na-more\"><summary>Show ${mine.length-visible} more action${mine.length-visible===1?'':'s'}<\/summary><ol class=\"na-list\" start=\"${visible+1}\">${mine.slice(visible).map((g,i)=>taskRow(g,i+visible)).join('')}<\/ol><\/details>`:''}`:'<div class=\"na-clear\"><span aria-hidden=\"true\">\u2713<\/span><p>No action is currently required from you.<\/p><\/div>'}\n      ${urgentOffice.map(g=>`<aside class=\"na-cover\"><b>With the office: ${e(g.title)}<\/b><p>The office is handling this staffing issue. ${dueTag(g.time)}<\/p><a href=\"${e(g.href)}\">View visit<\/a> \u00b7 <a href=\"#/contact\">Contact the office<\/a><\/aside>`).join('')}\n      ${office.length?`<details class=\"na-waiting\"><summary><span>With the office<\/span><span class=\"na-count\">${office.length} review${office.length===1?'':'s'}<\/span><\/summary><p class=\"na-muted\">These checks belong to the office. They are separate from the actions above.<\/p><ul class=\"na-wait-list\">${office.map(g=>`<li><div><h3>${e(g.title)}<\/h3><p>${g.items.size} item${g.items.size===1?'':'s'} being reviewed<\/p>${subitems(g)}<\/div><a href=\"${e(g.href)}\">${e(g.verb)}<\/a><\/li>`).join('')}<\/ul><\/details>`:''}\n      ${next?`<aside class=\"na-next-visit\"><div><span class=\"na-muted\">${next.starts_at&&Date.parse(next.starts_at)<=model.now?'Current visit':'Next visit'}<\/span><p><b>${e(dateLabel(next.date))} at ${e(next.start)}<\/b>${next.other_name?' \u00b7 '+e(next.other_name):''}<\/p><span class=\"na-muted\">${next.status==='requested'?'Awaiting confirmation':'Confirmed'} \u00b7 ${e(next.hours)} hours<\/span><\/div><a href=\"#/journey?panel=shift&booking=${Number(next.id)}\">View visit<\/a><\/aside>`:''}\n      <p class=\"na-foot\">This list is based on your current records. <a href=\"#/contact\">Need help?<\/a><\/p><\/div>`;\n  }\n  return {render};\n})();\n\nconst SAMPLE={\"label\": \"Waiting for the office\", \"tasks\": [{\"task_key\": \"20:recruit:interview\", \"kind\": \"recruitment\", \"label\": \"Interview review\", \"destination\": \"#/journey?panel=recruitment\", \"owner_kind\": \"office\", \"state\": \"ready\"}, {\"task_key\": \"20:recruit:references\", \"kind\": \"recruitment\", \"label\": \"Reference checks\", \"destination\": \"#/journey?panel=recruitment\", \"owner_kind\": \"office\", \"state\": \"ready\"}, {\"task_key\": \"20:doc-review:1\", \"kind\": \"document\", \"label\": \"Review received First Aid\", \"destination\": \"#/admin/compliance\", \"owner_kind\": \"office\", \"state\": \"ready\", \"detail\": \"Uploaded 11 September 2026.\"}, {\"task_key\": \"20:setup:verify-first-aid\", \"kind\": \"setup\", \"label\": \"Office review: First Aid\", \"destination\": \"#/journey\", \"owner_kind\": \"office\", \"state\": \"ready\", \"detail\": \"Awaiting verification.\"}], \"role\": \"worker\", \"today\": \"2026-09-12\", \"as_of\": \"2026-09-12T02:00:00Z\", \"next\": []};document.getElementById('content').innerHTML=CareNextActions.render(SAMPLE);if(SAMPLE.role==='participant')document.querySelector('.na-tool-links').innerHTML='<a href=\"#/journey?panel=reviews\">Timesheets<\/a><a href=\"#/journey?panel=routines\">Usual visits<\/a><a href=\"#/journey?panel=transitions\">Change support<\/a>';document.addEventListener('click',event=>{const control=event.target.closest('a,button');if(!control)return;event.preventDefault();document.getElementById('previewNote').textContent='Preview only: '+control.textContent.trim()+'. Your account and records have not changed.';});<\/script><\/body><\/html>", "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Next actions \u2014 sample preview<\/title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,sans-serif;background:#fbfaf7;color:#1b2440;--ink:#1b2440;--ink-soft:#58647c;--card:#fff;--line:#d9dce3;--amber:#d5ab3d;--teal-deep:#235c51}a{color:#203566}main{max-width:1050px;margin:auto;padding:26px 22px}.flow-head{display:flex;justify-content:space-between;align-items:center}.flow-head a{font-size:.85rem}.flow-tabs a{display:inline-block;padding:7px;text-decoration:none}.preview-brand{font-size:15px;font-weight:750;color:#203566;border-bottom:1px solid #d9dce3;padding:14px 22px;background:#fff}.preview-brand span{font-size:12px;font-weight:400;color:#657083;margin-left:10px}.preview-note{padding:8px 22px;background:#fff6dd;color:#624c21;font-size:12px}.preview-note:empty{display:none}#page-journey .flow-head{align-items:center;gap:12px}#page-journey .flow-head h1{font-size:clamp(1.65rem,3vw,2.2rem);margin:0}#flowPerson:empty{display:none}#flowPerson{font-size:.9rem;margin:.35rem 0 0}#flowTabs{border:0;margin:12px 0 22px;padding:0;align-items:flex-start;justify-content:space-between}#flowTabs .na-tools{font-size:.88rem}#flowTabs .na-tools summary{padding:.45rem .6rem;cursor:pointer;border:1px solid var(--line,#d8dee5);border-radius:6px}#flowTabs .na-tool-links{display:flex;flex-wrap:wrap;gap:3px;padding:6px 0}#flowTabs .na-back{padding:7px 0;min-height:32px}#flowTabs:empty{display:none}\n.na-workspace{max-width:920px;margin:0 auto;color:var(--ink,#1b2440)}.na-intro{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;margin:0 0 18px}.na-intro h2{font-size:1.25rem;margin:0 0 5px;line-height:1.4}.na-intro p,.na-task-body>p{font-size:.9rem;line-height:1.5;color:var(--ink-soft,#4c5e70);margin:.25rem 0}.na-refresh{flex-shrink:0;font:inherit;font-size:.8rem;background:transparent;border:1px solid var(--line,#d8dee5);border-radius:6px;padding:7px 10px;min-height:34px;color:inherit;cursor:pointer}\n.na-list{list-style:none;margin:0;padding:0}.na-task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line,#d8dee5)}.na-task.na-first{background:var(--card,#fff);border:1px solid var(--line,#d8dee5);border-left:4px solid var(--amber,#d1a837);border-radius:10px;padding:18px 16px;margin-bottom:2px}.na-number{display:grid;place-items:center;width:26px;height:26px;font-size:.8rem;border:1px solid var(--line,#d8dee5);border-radius:50%;color:var(--ink-soft,#4c5e70)}.na-first .na-number{background:#203566;color:#fff;border-color:#203566}.na-task-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.na-task-title h3{font-size:1.02rem;line-height:1.45;margin:0}.na-task-go{display:flex;align-items:flex-end;gap:6px;flex-direction:column}.na-start{font-size:.7rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;color:var(--ink-soft,#4c5e70)}.na-action{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line,#d8dee5);border-radius:6px;padding:8px 11px;min-height:36px;font:inherit;font-size:.84rem;font-weight:700;line-height:1.3;text-decoration:none;color:inherit;background:transparent;cursor:pointer;box-sizing:border-box}.na-primary{background:#203566;color:white;border-color:#203566}.na-tag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--ink-soft,#4c5e70);white-space:normal}.na-tag.na-overdue{color:#972e22;background:#fff0ea;padding:2px 6px;border-radius:4px}.na-tag.na-due{color:#704e12;background:#fff6dd;padding:2px 6px;border-radius:4px}\n.na-details{margin:8px 0 0}.na-details summary{font-size:.82rem;cursor:pointer;padding:3px 0;color:inherit}.na-subitems{list-style:none;padding:0 0 0 10px;margin:5px 0;border-left:2px solid var(--line,#d8dee5)}.na-subitems li{display:flex;gap:12px;align-items:start;justify-content:space-between;margin:0;padding:7px 0;font-size:.84rem}.na-subitems strong{display:block;font-weight:600}.na-subitems p{margin:3px 0;color:var(--ink-soft,#4c5e70);font-size:.82rem;white-space:pre-wrap;overflow-wrap:anywhere}.na-subitems a{font-size:.82rem;padding:3px;flex-shrink:0}.na-more{border-bottom:1px solid var(--line,#d8dee5);margin:5px 0 0}.na-more>summary{font-size:.88rem;padding:14px 0;cursor:pointer;font-weight:600}.na-waiting{margin-top:24px;border:1px solid var(--line,#d8dee5);border-radius:8px;padding:0 14px;background:var(--card,#fff)}.na-waiting>summary{padding:13px 0;cursor:pointer;font-size:.95rem;font-weight:600}.na-count{font-size:.8rem;font-weight:400;margin-left:10px;color:var(--ink-soft,#4c5e70)}.na-muted,.na-foot{font-size:.84rem;color:var(--ink-soft,#4c5e70)}.na-wait-list{list-style:none;margin:0;padding:0}.na-wait-list>li{display:flex;gap:18px;justify-content:space-between;align-items:start;padding:12px 0;border-top:1px solid var(--line,#d8dee5)}.na-wait-list h3{font-size:.95rem;margin:0}.na-wait-list p{font-size:.84rem;margin:4px 0}.na-wait-list>li>a{font-size:.84rem;flex-shrink:0;padding:3px}.na-next-visit{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:20px 0 0;border-top:1px solid var(--line,#d8dee5);padding:16px 0}.na-next-visit p{font-size:.92rem;margin:4px 0}.na-next-visit>a{font-size:.85rem;flex-shrink:0}.na-foot{margin:20px 0 0}.na-clear{display:flex;align-items:center;gap:12px;padding:14px 0;color:var(--teal-deep,#246841)}.na-clear>span{font-size:1.35rem}.na-clear p{font-size:.95rem}.na-cover{border-left:3px solid #b23c28;padding:10px 14px;background:var(--card,#fff);margin-top:18px;font-size:.9rem}.na-cover p{margin:6px 0}#naStatus:empty{display:none}#naStatus{font-size:.9rem;padding:10px 0}.na-workspace :is(a,button,summary):focus-visible,.na-tools summary:focus-visible{outline:3px solid #bd6e17;outline-offset:3px}.na-workspace :is(h3,p,a){overflow-wrap:anywhere}\n.na-office-bar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:0 0 16px}.na-office-bar .flow-form{display:flex;align-items:end;gap:8px;max-width:100%;flex-wrap:wrap}.na-office-bar .flow-form label{min-width:min(220px,100%)}.na-office-bar .flow-form [data-flow-status]:empty{display:none}.na-office-list{border-top:1px solid var(--line,#d8dee5)}.na-office-row{padding:14px 0;border-bottom:1px solid var(--line,#d8dee5)}.na-office-line{display:flex;align-items:center;justify-content:space-between;gap:16px}.na-office-line h3{font-size:1rem;margin:0}.na-office-line p{font-size:.85rem;margin:4px 0}.na-office-row details{margin-top:8px}.na-office-row summary{cursor:pointer;font-size:.84rem}.na-office-row .flow-form{margin:10px 0;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.na-office-row .flow-form [data-flow-status]:empty{display:none}.na-office-row .flow-form label{max-width:100%;font-size:.85rem}.na-office-row .flow-form input,.na-office-row .flow-form select{padding:7px}.na-office-meta{font-size:.85rem;color:var(--ink-soft,#4c5e70)}\n@media(max-width:650px){.na-intro{flex-wrap:wrap;gap:8px}.na-task,.na-task.na-first{grid-template-columns:24px minmax(0,1fr);gap:10px;padding:15px 10px}.na-task-go{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}.na-start{order:2}.na-task-title h3{font-size:1rem}.na-next-visit,.na-wait-list>li{flex-wrap:wrap;gap:8px}.na-office-line{align-items:start;flex-wrap:wrap}.na-action{min-height:40px}}\n@media(pointer:coarse){.na-workspace :is(button,.na-action),.na-tools summary,.na-more>summary,.na-waiting>summary{min-height:44px}.na-subitems a,.na-details summary,.na-wait-list>li>a,.na-next-visit>a{min-height:36px;display:inline-flex;align-items:center}}\nhtml.high-contrast :is(.na-tag,.na-number,.na-muted,.na-start,.na-count,.na-foot){color:inherit}.na-primary:disabled,.na-refresh:disabled{opacity:.6;cursor:wait}\n\n.na-office-line>div{min-width:0;flex:1}.na-office-line :is(h3,p){overflow-wrap:anywhere}.na-office-line>.na-action{flex-shrink:0}\n<\/style><\/head><body><div class=\"preview-brand\">The Care Web<span>Next actions preview<\/span><\/div><div id=\"previewNote\" class=\"preview-note\" role=\"status\"><\/div><main id=\"page-journey\"><div class=\"flow-head\"><h1>Next actions<\/h1><a href=\"#/account\">Settings<\/a><\/div><nav id=\"flowTabs\" class=\"flow-tabs\"><details class=\"na-tools\"><summary>More tools<\/summary><div class=\"na-tool-links\"><a href=\"#/journey?panel=recruitment\">Application<\/a><a href=\"#/journey?panel=payroll\">Pay status<\/a><a href=\"#/journey?panel=renewals\">Upcoming renewals<\/a><\/div><\/details><\/nav><div id=\"content\"><\/div><\/main><script>const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));const fmtAU=x=>new Date(x+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});'use strict';\n/* Presentation groups do not complete, dismiss or reassign the underlying tasks. */\nwindow.CareNextActions = (() => {\n  const e = value => esc(String(value ?? ''));\n  const safe = href => /^#\\/(?!\\/)/.test(String(href || '')) ? href : '#/contact';\n  const suffix = task => String(task.task_key || '').replace(/^\\d+:/,'');\n  const dateOnly = value => /^\\d{4}-\\d{2}-\\d{2}/.exec(String(value || ''))?.[0] || '';\n  const dateLabel = value => dateOnly(value) ? fmtAU(dateOnly(value)) : '';\n  const dayNumber = value => Date.parse(dateOnly(value)+'T00:00:00Z') / 864e5;\n  function timing(task, today, now) {\n    const due=dateOnly(task.due_at);if(!due)return {rank:9,label:'',className:'',stamp:Infinity};\n    const delta=dayNumber(due)-dayNumber(today),stamp=Date.parse(task.due_at);\n    // Visit deadlines are times; document due dates are calendar days.\n    const timed=['booking','cover'].includes(task.kind);\n    if(delta<0 || (timed && Number.isFinite(stamp) && stamp<now))return {rank:0,label:'Overdue',className:'na-overdue',stamp};\n    if(delta===0)return {rank:1,label:'Due today',className:'na-due',stamp};\n    if(delta<=7)return {rank:2,label:'Due '+dateLabel(due),className:'na-due',stamp};\n    return {rank:8,label:'Due '+dateLabel(due),className:'',stamp};\n  }\n  function action(task, role, destination) {\n    const href=safe(destination(task)),key=suffix(task),worker=role==='worker';\n    if(worker && href.startsWith('#/account/credentials'))return {group:'credentials',title:'Complete your document checklist',hint:'Add or replace the files listed in Credentials & checks.',verb:'Open checklist',href};\n    if(worker && href.startsWith('#/account/training'))return {group:'training',title:'Complete your training',hint:'Finish the modules that are outstanding or due for renewal.',verb:'Open training',href};\n    if(href==='#/support-plan')return {group:'support-plan',title:'Review your support plan',hint:'Complete the sections that still need your attention.',verb:'Open support plan',href};\n    if(href==='#/account/billing'||href==='#/journey?panel=billing')return {group:'funding',title:'Confirm your funding details',hint:'Check how your support will be paid for.',verb:'Review funding',href};\n    if(role==='coordinator'&&href==='#/clients')return {group:'client-documents',title:'Review their documents',hint:'Open the selected person\u2019s file to review the requested documents.',verb:'Open client file',href};\n    if(href==='#/account/documents')return {group:'documents',title:'Complete your document checklist',hint:'Review the missing, requested or expiring items on your file.',verb:'Open checklist',href};\n    if(key.includes('verify-email'))return {group:'email',title:role==='coordinator'?'Confirm their email address':'Confirm your email address',hint:role==='coordinator'?'Ask the person to use the verification link in their email.':'Use the verification link in your email. You can request another copy.',verb:role==='coordinator'?'Open client file':'Resend email',href:role==='coordinator'?'#/clients':href,email:role!=='coordinator'};\n    if(href==='#/account/profile')return {group:'profile',title:'Complete your profile',hint:'Update the details needed for your account.',verb:'Open profile',href};\n    const verb={booking:'Review request',shift:'Write shift note',review:worker?'Answer question':'Review timesheet',followup:'Share feedback',renewal:'Renew document',document:'Open document',setup:href.startsWith('#/form/')?'Review form':'Open details'}[task.kind] || 'Open task';\n    return {group:href,title:task.label || 'Review this task',hint:task.detail || '',verb,href};\n  }\n  function waitingAction(task, role) {\n    const key=suffix(task),worker=role==='worker',destination=String(task.destination || '');\n    if(task.kind==='cover')return {group:'cover:'+key,title:task.label,href:safe(destination),verb:'View visit'};\n    if(task.kind==='recruitment'||/setup:activation/.test(key))return {group:'application',title:'Application review',href:'#/journey?panel=recruitment',verb:'View application'};\n    if(task.kind==='document'||/setup:(verify-|screening-status|register-)/.test(key))return {group:'documents',title:'Document and screening checks',href:worker?'#/account/credentials':role==='coordinator'?'#/clients':'#/account/documents',verb:'View documents'};\n    if(task.kind==='transition')return {group:'transition:'+destination,title:'Support changes',href:safe(destination),verb:'View request'};\n    // Never send a person into an office-only route or back into this same list.\n    const href=destination.startsWith('#/admin')||/^#\\/journey(?:\\?panel=tasks)?$/.test(destination)?'#/contact':safe(destination);\n    return {group:href,title:task.label || 'Office review',href,verb:href==='#/contact'?'Contact the office':'View record'};\n  }\n  function build(data,destination) {\n    const now=Date.parse(data.as_of || '') || Date.now(),today=data.today || new Date(now).toISOString().slice(0,10);\n    const groups={person:new Map(),office:new Map()},seen=new Set();\n    for(const t of data.tasks || []){\n      if(t.state==='completed' || seen.has(t.task_key))continue;seen.add(t.task_key);\n      const owner=t.owner_kind==='person'?'person':'office';\n      const meta=owner==='person'?action(t,data.role,destination):waitingAction(t,data.role);\n      let group=groups[owner].get(meta.group);\n      if(!group){group={...meta,owner,tasks:[],items:new Map(),rank:9,stamp:Infinity};groups[owner].set(meta.group,group);}\n      const time=timing(t,today,now);\n      const workRank=meta.group==='email'?2:meta.group==='profile'?3:({review:2,shift:2,booking:3,setup:4,document:4,followup:5,renewal:6}[t.kind] ?? 6);\n      const rank=Math.min(time.rank,workRank);\n      group.tasks.push(t);\n      if(rank<group.rank || (rank===group.rank&&time.stamp<group.stamp)){group.rank=rank;group.stamp=time.stamp;group.time=time;group.first=t;if(owner==='person')group.href=meta.href;}\n      const href=owner==='person'?meta.href:group.href;\n      const type=/[?&]type=([^&]+)/.exec(href)?.[1];\n      const itemLabel=owner==='office'&&group.group==='documents'?String(t.label||'').replace(/^(?:Office review: |Review received |Office check: )/,''):String(t.label||'');\n      const itemKey=owner==='person'&&type?'type:'+type:href+'|'+itemLabel;\n      let item=group.items.get(itemKey);\n      if(!item){item={task:t,href,label:itemLabel || 'Review item',notes:new Set(),time};group.items.set(itemKey,item);}\n      if(time.rank<item.time.rank){item.task=t;item.label=itemLabel;item.time=time;}\n      if(t.detail)item.notes.add(t.detail);\n    }\n    const sort=list=>[...list.values()].sort((a,b)=>a.rank-b.rank||a.stamp-b.stamp||String(a.first?.task_key||a.group).localeCompare(String(b.first?.task_key||b.group)));\n    return {mine:sort(groups.person),office:sort(groups.office),today,now};\n  }\n  const dueTag = time => time?.label?`<span class=\"na-tag ${time.className}\">${e(time.label)}<\/span>`:'';\n  function subitems(group) {\n    const items=[...group.items.values()].sort((a,b)=>a.time.rank-b.time.rank||a.time.stamp-b.time.stamp);\n    if(items.length===1 && items[0].label===group.title && (!items[0].notes.size || [...items[0].notes].join(' ')===group.hint))return '';\n    return `<details class=\"na-details\"><summary>${items.length===1?'Details':items.length+' items to check'}<\/summary><ul class=\"na-subitems\">${items.map(item=>`<li><div><strong>${e(item.label)}<\/strong>${dueTag(item.time)}${[...item.notes].map(n=>`<p>${e(n)}<\/p>`).join('')}<\/div>${group.owner==='person'&&!group.email?`<a href=\"${e(item.href)}\" data-flow-task=\"${e(item.task.task_key)}\" aria-label=\"Open ${e(item.label)}\">Open<\/a>`:''}<\/li>`).join('')}<\/ul><\/details>`;\n  }\n  function taskRow(group,index){\n    return `<li class=\"na-task${index===0?' na-first':''}\"><span class=\"na-number\" aria-hidden=\"true\">${index+1}<\/span><div class=\"na-task-body\"><div class=\"na-task-title\"><h3>${e(group.title)}<\/h3>${dueTag(group.time)}<\/div>${group.hint?`<p>${e(group.hint)}<\/p>`:''}${subitems(group)}<\/div><div class=\"na-task-go\">${index===0?'<span class=\"na-start\">Start here<\/span>':''}${group.email?`<button type=\"button\" class=\"na-action${index===0?' na-primary':''}\" data-flow-action=\"resend-email\" data-flow-task=\"${e(group.first.task_key)}\">Resend email<\/button>`:`<a class=\"na-action${index===0?' na-primary':''}\" href=\"${e(group.href)}\" data-flow-task=\"${e(group.first.task_key)}\">${e(group.verb)}<\/a>`}<\/div><\/li>`;\n  }\n  function render(data,destination=t=>t.destination) {\n    const model=build(data,destination),{mine,office}=model;\n    // Keep every overdue/today group visible, even when there are more than three.\n    const visible=Math.max(3,mine.filter(g=>g.time?.rank<=1).length);\n    const heading=mine.length?mine.length+' action'+(mine.length===1?'':'s')+' need'+(mine.length===1?'s':'')+' your attention':office.length?'Nothing you need to do right now':'You are up to date';\n    const hint=mine.length?'Start with the first item. Related steps are grouped together.':office.length?'Your outstanding reviews are with the office.':'New requests and anything due will appear here.';\n    const activeBookings=new Set(mine.flatMap(g=>g.tasks).map(t=>/[?&]booking=(\\d+)/.exec(String(t.destination))?.[1]).filter(Boolean));\n    const next=(data.next || []).find(v=>!activeBookings.has(String(v.id)) && (!v.ends_at||Date.parse(v.ends_at)>model.now));\n    const urgentOffice=office.filter(g=>g.time?.rank<=1&&g.tasks.some(t=>t.kind==='cover'));\n    return `<div class=\"na-workspace\"><div class=\"na-intro\"><div><h2>${e(heading)}<\/h2><p>${e(hint)}<\/p><\/div><button type=\"button\" class=\"na-refresh\" data-flow-action=\"refresh\">Refresh list<\/button><\/div><p id=\"naStatus\" role=\"status\" aria-live=\"polite\"><\/p>\n      ${mine.length?`<ol class=\"na-list\">${mine.slice(0,visible).map(taskRow).join('')}<\/ol>${mine.length>visible?`<details class=\"na-more\"><summary>Show ${mine.length-visible} more action${mine.length-visible===1?'':'s'}<\/summary><ol class=\"na-list\" start=\"${visible+1}\">${mine.slice(visible).map((g,i)=>taskRow(g,i+visible)).join('')}<\/ol><\/details>`:''}`:'<div class=\"na-clear\"><span aria-hidden=\"true\">\u2713<\/span><p>No action is currently required from you.<\/p><\/div>'}\n      ${urgentOffice.map(g=>`<aside class=\"na-cover\"><b>With the office: ${e(g.title)}<\/b><p>The office is handling this staffing issue. ${dueTag(g.time)}<\/p><a href=\"${e(g.hre ('a,button');if(!control)return;event.preventDefault();document.getElementById('previewNote').textContent='Preview only: '+control.textContent.trim()+'. Your account and records have not changed.';});<\/script><\/body><\/html>"];const frame=document.getElementById('preview');function show(){frame.srcdoc=FRAMES[Number(document.getElementById('sample').value)];}document.getElementById('sample').onchange=show;for(const id of ['phone','wide'])document.getElementById(id).onclick=()=>{frame.classList.toggle('phone',id==='phone');for(const name of ['phone','wide'])document.getElementById(name).setAttribute('aria-pressed',String(id===name));};show();</script></body></html>
